<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>London Green — A Survey of Open Spaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=IM+Fell+English:ital,wght@0,400;1,400&family=IM+Fell+DW+Pica+SC&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --paper:    #ede4cf;
    --paper-2:  #e3d8bd;
    --ink:      #1a140c;
    --ink-soft: #2c2418;
    --ochre:    #8a4818;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; overflow: hidden;
    background: var(--ink);
    font-family: 'IM Fell English', Georgia, serif;
    color: var(--ink);
  }

  /* ── Map fills viewport ── */
  #map {
    position: absolute;
    inset: 0;
    background: var(--paper);
  }

  /* Parchment filter on OSM tiles — same approach as Marauder's Map */
  .leaflet-tile-pane {
    filter: sepia(0.85) saturate(0.3) brightness(0.9) contrast(0.88) hue-rotate(8deg);
  }
  .leaflet-container { background: var(--paper); }
  .leaflet-control-zoom a {
    background: var(--paper-2) !important;
    color: var(--ink) !important;
    border-color: var(--ink-soft) !important;
    font-family: 'IM Fell English', serif !important;
  }
  .leaflet-control-attribution { display: none; }

  /* ── Parchment grain overlay ── */
  #grain {
    position: absolute; inset: 0; z-index: 500;
    pointer-events: none;
    background-image:
      radial-gradient(ellipse 3px 4px at 12% 23%, rgba(90,50,10,0.16) 0%, transparent 100%),
      radial-gradient(ellipse 5px 3px at 34% 67%, rgba(80,40,5,0.11) 0%, transparent 100%),
      radial-gradient(ellipse 2px 3px at 58% 14%, rgba(100,60,10,0.13) 0%, transparent 100%),
      radial-gradient(ellipse 4px 2px at 78% 82%, rgba(70,35,5,0.12) 0%, transparent 100%),
      radial-gradient(ellipse 3px 5px at 89% 41%, rgba(90,50,10,0.09) 0%, transparent 100%),
      radial-gradient(ellipse 6px 3px at 22% 88%, rgba(80,45,8,0.11) 0%, transparent 100%),
      radial-gradient(ellipse 100% 100% at 50% 50%, transparent 38%, rgba(26,20,12,0.42) 100%);
    mix-blend-mode: multiply;
  }

  /* ── Fine crosshatch grain ── */
  #grain::after {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    background-image:
      repeating-linear-gradient(0deg,  rgba(60,40,15,0.022) 0px, rgba(60,40,15,0.022) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(60,40,15,0.016) 0px, rgba(60,40,15,0.016) 1px, transparent 1px, transparent 4px);
    mix-blend-mode: multiply;
  }

  /* ── Masthead ── */
  #masthead {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50px;
    z-index: 1000;
    background: var(--paper);
    border-bottom: 3px double var(--ink);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 10px;
  }
  #masthead::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 0.4px solid rgba(26,20,12,0.3);
    pointer-events: none;
  }
  /* diamond corner ornaments */
  #masthead::after {
    content: '';
    position: absolute;
    inset: 0; pointer-events: none;
  }
  .mast-diamond {
    position: absolute; width: 7px; height: 7px;
    background: var(--ink); transform: rotate(45deg);
    z-index: 1001;
  }
  #md-tl { top:  2px; left:  2px; }
  #md-tr { top:  2px; right: 2px; }
  #md-bl { bottom: 2px; left:  2px; }
  #md-br { bottom: 2px; right: 2px; }

  #masthead h1 {
    font-family: 'UnifrakturCook', serif;
    font-size: 1.55rem; font-weight: 700;
    line-height: 1; color: var(--ink);
  }
  #masthead .sub {
    font-family: 'IM Fell DW Pica SC', serif;
    font-size: 0.58rem; letter-spacing: 0.2em;
    color: var(--ink-soft); margin-top: 3px;
  }

  /* ── Chorus strip ── */
  #chorus {
    position: absolute;
    top: 50px; left: 0; right: 0;
    height: 64px;
    z-index: 1000;
    background: var(--paper-2);
    border-bottom: 3px double var(--ink);
    display: flex;
  }
  .cc {
    flex: 1 1 0;
    padding: 4px 2px 3px;
    text-align: center;
    border-right: 1px solid rgba(26,20,12,0.22);
    position: relative;
  }
  .cc:last-child { border-right: none; }
  .cv { width: 100%; height: 38px; display: block; }
  .clbl {
    font-family: 'IM Fell DW Pica SC', serif;
    font-size: 0.48rem; letter-spacing: 0.14em;
    color: var(--ink-soft); margin-top: 2px;
  }
  .cc.mute  { opacity: 0.7; }
  .cc.ready { animation: rpulse 4s ease-in-out infinite; }
  @keyframes rpulse {
    0%,100% { background: rgba(138,72,24,0.05); }
    50%      { background: rgba(138,72,24,0.13); }
  }

  /* Lamp cell: dramatic night state — dark background, glowing lamps.
     Daytime is the default (just the muted state).
     The .lit modifier overrides everything else for clear visual signal. */
  .cc[data-id="lamps"].lit {
    background: #1a140c !important;
    animation: lampglow 5s ease-in-out infinite;
  }
  .cc[data-id="lamps"].lit .clbl {
    color: #d4b87a;
  }
  .cc[data-id="lamps"].lit .crd {
    color: #f4d89a;
    text-shadow:
      0 0 4px rgba(244,216,154,0.6),
      0 0 4px rgba(244,216,154,0.6);
  }
  @keyframes lampglow {
    0%,100% { box-shadow: inset 0 0 8px rgba(244,216,154,0.15); }
    50%      { box-shadow: inset 0 0 14px rgba(244,216,154,0.3); }
  }

  /* Numeric readout — sits inside each cell as a small italic number,
     gives the precise value the illustration only suggests. */
  .crd {
    position: absolute;
    top: 3px; right: 4px;
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 12px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1;
    pointer-events: none;
    text-shadow:
      0 0 3px var(--paper-2), 0 0 3px var(--paper-2),
      0 0 3px var(--paper-2), 0 0 3px var(--paper-2);
    z-index: 2;
  }
  .crd .crd-u {
    font-size: 9px;
    opacity: 0.75;
  }
  .crd .crd-arrow {
    font-size: 16px;
    font-style: normal;
    vertical-align: -1px;
    margin-right: 1px;
  }
  .crd {
    transition: opacity 0.18s ease;
  }
  .crd.crd-fade {
    opacity: 0.15;
  }

  /* ── Toggle ── */
  #toggle {
    position: absolute;
    bottom: 28px; left: 50%; transform: translateX(-50%);
    z-index: 1000;
    display: flex; align-items: center; gap: 10px;
    background: rgba(237,228,207,0.95);
    border: 1px solid var(--ink-soft);
    padding: 5px 16px 6px;
    cursor: pointer; user-select: none;
  }
  #toggle::before {
    content: ''; position: absolute; inset: 3px;
    border: 0.4px solid var(--ink-soft); pointer-events: none;
  }
  #toggle:hover { background: var(--paper); }
  .tl {
    font-family: 'IM Fell DW Pica SC', serif;
    font-size: 9px; letter-spacing: 0.2em;
    color: var(--ink-soft); opacity: 0.4; transition: opacity .3s;
  }
  .tl.on { opacity: 1; color: var(--ink); }
  .pip {
    width: 9px; height: 9px;
    background: var(--ink-soft); transform: rotate(45deg);
    opacity: 0.3; transition: opacity .3s, background .3s; flex-shrink: 0;
  }
  #toggle.city .pip { background: var(--ink); opacity: 1; }

  /* ── Legend ── */
  #legend {
    position: absolute;
    bottom: 28px; right: 14px;
    z-index: 1000;
    background: rgba(237,228,207,0.95);
    border: 1px solid var(--ink-soft);
    padding: 10px 14px;
  }
  #legend::before {
    content: ''; position: absolute; inset: 3px;
    border: 0.4px solid var(--ink-soft); pointer-events: none;
  }
  .leg-head {
    font-family: 'IM Fell DW Pica SC', serif;
    font-size: 8px; letter-spacing: 0.2em;
    color: var(--ink-soft); border-bottom: 1px solid rgba(26,20,12,0.3);
    padding-bottom: 5px; margin-bottom: 7px;
  }
  .leg-row {
    display: flex; align-items: center; gap: 8px;
    font-family: 'IM Fell English', serif;
    font-style: italic; font-size: 10px;
    color: var(--ink-soft); margin-bottom: 5px;
  }
  .leg-row:last-child { margin-bottom: 0; }
  .leg-swatch {
    width: 14px; height: 10px; flex-shrink: 0;
  }

  /* Loading notice */
  #loading-notice {
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 1001;
    font-family: 'IM Fell English', serif;
    font-style: italic; font-size: 0.95rem;
    color: var(--ink-soft);
    text-align: center;
    pointer-events: none;
    transition: opacity 1s;
  }

  /* ── Pub markers ── */
  .pub-icon, .pub-cluster-icon { background: transparent; border: none; }
  .pub-icon svg, .pub-cluster-icon svg { display: block; overflow: visible; }
  .pub-cluster-icon .ccount {
    position: absolute;
    top: 50%; left: 100%;
    transform: translate(2px, -50%);
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 11px;
    color: var(--ink);
    white-space: nowrap;
    text-shadow: 0 0 3px var(--paper), 0 0 3px var(--paper);
    pointer-events: none;
  }

  /* Parchment-styled popups for pub names */
  .leaflet-popup-content-wrapper {
    background: var(--paper) !important;
    color: var(--ink) !important;
    border: 1px solid var(--ink-soft) !important;
    border-radius: 0 !important;
    box-shadow: 0 1px 4px rgba(26,20,12,0.3) !important;
    font-family: 'IM Fell English', serif !important;
  }
  .leaflet-popup-content {
    margin: 8px 14px !important;
    font-family: 'IM Fell English', serif !important;
    font-size: 12px !important;
    line-height: 1.3 !important;
  }
  .pub-name { font-size: 13px; }
  .pub-meta {
    font-style: italic;
    font-size: 10px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .leaflet-popup-tip {
    background: var(--paper) !important;
    border: 1px solid var(--ink-soft) !important;
  }
  .leaflet-popup-close-button {
    color: var(--ink-soft) !important;
  }

  /* Attribution */
  #attr {
    position: absolute;
    bottom: 6px; left: 14px;
    z-index: 1000;
    font-family: 'IM Fell English', serif;
    font-style: italic; font-size: 9px;
    color: var(--ink-soft); opacity: 0.6;
    pointer-events: none;
  }

  /* ── Celestial cartouche ── */
  #celestial {
    position: absolute;
    z-index: 600;
    pointer-events: none;
    transition: left 8s linear, top 8s linear, opacity 2s ease;
    /* initial position; JS sets real values */
    left: 50%; top: 30%;
    transform: translate(-50%, -50%);
    width: 92px; height: 92px;
  }
  #celestial svg { display: block; }

  /* ── Mobile adaptations ── */
  @media (max-width: 640px) {
    /* Hide legend by default — show on tap of a small chip */
    #legend {
      display: none;
      bottom: 70px;
      right: 8px;
    }
    #legend.shown { display: block; }
    #legend-chip {
      position: absolute;
      bottom: 28px; right: 14px;
      z-index: 1000;
      background: rgba(237,228,207,0.95);
      border: 1px solid var(--ink-soft);
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 16px;
      color: var(--ink);
    }
    /* Smaller cartouche on phones */
    #celestial { width: 68px; height: 68px; }
    #celestial svg { width: 68px; height: 68px; }
  }
  @media (min-width: 641px) {
    #legend-chip { display: none; }
  }

  /* ── Pub markers ── */
  .pub-icon {
    /* allow the SVG to overflow leaflet's icon box for the cluster numeral */
    overflow: visible !important;
  }
  .pub-icon svg {
    overflow: visible;
    display: block;
  }
  /* Parchment-styled popup */
  .leaflet-popup-content-wrapper {
    background: var(--paper) !important;
    color: var(--ink) !important;
    border: 1px solid var(--ink-soft) !important;
    border-radius: 0 !important;
    box-shadow: 0 1px 4px rgba(26,20,12,0.3) !important;
    font-family: 'IM Fell English', serif !important;
  }
  .leaflet-popup-content {
    margin: 8px 14px !important;
    font-family: 'IM Fell English', serif !important;
    font-size: 12px !important;
    line-height: 1.3 !important;
    color: var(--ink) !important;
  }
  .leaflet-popup-content .pub-name {
    font-weight: normal;
    font-size: 13px;
  }
  .leaflet-popup-content .pub-meta {
    font-style: italic;
    font-size: 10px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .leaflet-popup-tip {
    background: var(--paper) !important;
    border: 1px solid var(--ink-soft) !important;
  }
  .leaflet-popup-close-button {
    color: var(--ink-soft) !important;
    font-family: 'IM Fell English', serif !important;
    font-size: 14px !important;
  }
</style>
</head>
<body>

<!-- Map -->
<div id="map"></div>
<div id="grain"></div>

<!-- Masthead -->
<div id="masthead">
  <span class="mast-diamond" id="md-tl"></span>
  <span class="mast-diamond" id="md-tr"></span>
  <span class="mast-diamond" id="md-bl"></span>
  <span class="mast-diamond" id="md-br"></span>
  <h1>London</h1>
  <div class="sub">A Survey of Parks, Pubs, Commons &amp; Open Waters &middot; Inner London</div>
</div>

<!-- Chorus -->
<div id="chorus">
  <div class="cc" data-id="thames"><span class="crd" id="rd-thames"></span><svg viewBox="0 0 60 38" class="cv" id="cv-thames"></svg><div class="clbl">River</div></div>
  <div class="cc" data-id="wind">  <span class="crd" id="rd-wind"></span>  <svg viewBox="0 0 60 38" class="cv" id="cv-wind"></svg>  <div class="clbl">Wind</div></div>
  <div class="cc" data-id="air">   <span class="crd" id="rd-air"></span>   <svg viewBox="0 0 60 38" class="cv" id="cv-air"></svg>   <div class="clbl">Air</div></div>
  <div class="cc" data-id="lamps"> <span class="crd" id="rd-lamps"></span> <svg viewBox="0 0 60 38" class="cv" id="cv-lamps"></svg> <div class="clbl">Lamps</div></div>
  <div class="cc" data-id="pollen"><span class="crd" id="rd-pollen"></span><svg viewBox="0 0 60 38" class="cv" id="cv-pollen"></svg><div class="clbl">Pollen</div></div>
  <div class="cc" data-id="temp">  <span class="crd" id="rd-temp"></span>  <svg viewBox="0 0 60 38" class="cv" id="cv-temp"></svg>  <div class="clbl">Temp</div></div>
</div>

<!-- Toggle -->
<div id="toggle" onclick="doToggle()">
  <span class="tl on" id="ll">Land</span>
  <div class="pip"></div>
  <span class="tl"    id="lc">City</span>
  <div class="pip"></div>
  <span class="tl"    id="lp">Pubs</span>
</div>

<!-- Legend chip (mobile only) -->
<div id="legend-chip" onclick="document.getElementById('legend').classList.toggle('shown')">?</div>

<!-- Legend -->
<div id="legend">
  <div class="leg-head">The Map</div>
  <div class="leg-row"><svg class="leg-swatch"><rect width="14" height="10" fill="#c8ddb8" stroke="#3d6b3a" stroke-width="0.8"/></svg>Parks &amp; open space</div>
  <div class="leg-row"><svg class="leg-swatch"><rect width="14" height="10" fill="#b8d4e8" stroke="#4a7a9b" stroke-width="0.8"/></svg>Rivers &amp; lakes</div>
  <div class="leg-row"><svg class="leg-swatch" viewBox="0 0 14 14" style="width:12px;height:12px"><path d="M3.2,3 Q5,1.5 7,2.2 Q9,1.5 10.8,3 L10.8,4 L3.2,4 Z" fill="#1a140c"/><rect x="3" y="4" width="6" height="7" fill="#1a140c"/><path d="M9,5.5 q3,0.5 3,2.5 t-3,2.5" fill="none" stroke="#1a140c" stroke-width="1"/></svg>Pubs (toggle)</div>
  <div class="leg-row"><svg class="leg-swatch" style="opacity:0.5"><rect width="14" height="10" fill="#dfd0a8" stroke="#8a7a5a" stroke-width="0.8"/></svg>City (toggle)</div>
</div>

<div id="loading-notice">— the map is being drawn —</div>

<!-- Sun/moon cartouche — floats over the map, position follows real sky -->
<div id="celestial">
  <svg id="celestial-svg" viewBox="0 0 80 80" width="92" height="92"></svg>
</div>

<div id="attr">OpenStreetMap contributors · open-meteo · Environment Agency</div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════
   PALETTE
══════════════════════════════════════════════════════ */
const INK   = '#1a140c';
const PAPER = '#e3d8bd';

/* ══════════════════════════════════════════════════════
   LIVE DATA
══════════════════════════════════════════════════════ */
const W = { weather: null, air: null, tide: null, sun: null };
const RLAT = 51.505, RLON = -0.118;

async function fetchAll() {
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${RLAT}&longitude=${RLON}&current=temperature_2m,rain,wind_speed_10m,wind_direction_10m,cloud_cover&daily=sunrise,sunset&timezone=Europe/London`);
    const j = await r.json();
    W.weather = j.current;
    W.sun = j.daily ? { sunrise: j.daily.sunrise[0], sunset: j.daily.sunset[0] } : null;
  } catch(e) {}
  try {
    const r = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${RLAT}&longitude=${RLON}&current=nitrogen_dioxide,birch_pollen,grass_pollen,alder_pollen,mugwort_pollen,ragweed_pollen&timezone=Europe/London`);
    W.air = (await r.json()).current;
  } catch(e) {}
  // Westminster tide gauge (RLOI 7389). Use the readings endpoint with
  // _sorted to get newest first, _limit=1 for the single most recent value.
  // The measure id "0006-level-tidal_level-i-15_min-mAOD" is the 15-min mean
  // tidal level relative to Ordnance Datum Newlyn (so values around 0 are
  // mean sea level; positive = high tide, negative = low tide).
  try {
    const r = await fetch('https://environment.data.gov.uk/flood-monitoring/id/measures/0006-level-tidal_level-i-15_min-mAOD/readings?_sorted&_limit=1');
    const j = await r.json();
    W.tide = j.items?.[0];
  } catch(e) { console.warn('Tide fetch failed', e); }
}

function nowConditions() {
  const now = new Date(), h = now.getHours(), month = now.getMonth();
  let isDark = h < 6 || h >= 20, isDawn = false;
  if (W.sun) {
    const t = now.getTime();
    const sr = new Date(W.sun.sunrise).getTime();
    const ss = new Date(W.sun.sunset).getTime();
    isDark = t < sr || t > ss;
    isDawn = !isDark && (t - sr) < 3600000;
  }
  const wind = W.weather?.wind_speed_10m ?? 8;
  const rain = W.weather?.rain ?? 0;
  const cloud = W.weather?.cloud_cover ?? 50;
  const tide = W.tide ? parseFloat(W.tide.value) : NaN;
  const pollenTotal = W.air
    ? (W.air.birch_pollen||0)+(W.air.alder_pollen||0)+(W.air.grass_pollen||0)+(W.air.mugwort_pollen||0)+(W.air.ragweed_pollen||0)
    : 0;
  return {
    is_dark: isDark, is_dawn: isDawn, month,
    wind_kph: wind, is_windy: wind > 22, is_calm: wind < 5,
    rain_mm: rain, is_raining: rain > 0.2,
    cloud, is_overcast: cloud > 70,
    // Westminster tide is mAOD, typical range −2.5 to +4.5
    tide_m: isNaN(tide) ? null : tide,
    is_high_tide: !isNaN(tide) && tide > 3.0,
    no2: W.air?.nitrogen_dioxide ?? null,
    pollen_total: pollenTotal,
    pollen_active: pollenTotal > 5
  };
}

/* ══════════════════════════════════════════════════════
   MAP
══════════════════════════════════════════════════════ */
const map = L.map('map', {
  zoomControl: true,
  attributionControl: false,
}).setView([51.505, -0.118], 12);

const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
}).addTo(map);

/* GeoJSON overlay layers */
const greenLayer = L.geoJSON(null, {
  style: {
    fillColor: '#c8ddb8',
    fillOpacity: 0.82,
    color: '#3d6b3a',
    weight: 0.8,
    opacity: 0.55
  }
}).addTo(map);

const waterLayer = L.geoJSON(null, {
  style: {
    fillColor: '#b8d4e8',
    fillOpacity: 0.88,
    color: '#4a7a9b',
    weight: 0.8,
    opacity: 0.6
  }
}).addTo(map);

/* ── Overpass query ── */
const OVERPASS = 'https://overpass-api.de/api/interpreter';

// Bounding box: inner London zones 1-2 approx
const BBOX = '51.44,-0.22,51.57,0.02';

/* localStorage cache: map geometry doesn't change often, so cache the
   processed GeoJSON for a week. Keyed by query name + bbox so an edit
   to the bbox naturally invalidates. Returns null on miss/expiry. */
const CACHE_VERSION = 'v2';
const CACHE_TTL_MS = 7 * 24 * 60 * 60 * 1000;

function cacheGet(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj.ts || (Date.now() - obj.ts) > CACHE_TTL_MS) return null;
    return obj.data;
  } catch(e) { return null; }
}
function cacheSet(key, data) {
  try {
    localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
  } catch(e) { /* quota exceeded — silently ignore */ }
}

async function fetchOverpass(query) {
  const r = await fetch(OVERPASS, {
    method: 'POST',
    body: 'data=' + encodeURIComponent(query)
  });
  const text = await r.text();
  if (!text.trim().startsWith('{')) throw new Error('non-JSON: ' + text.slice(0, 80));
  return JSON.parse(text);
}

/* ── OSM→GeoJSON converter ──
   Ways become Polygons. Relations are stitched: outer-role members
   are joined end-to-end into closed rings (so the Thames riverbank,
   which is composed of many outer ways, renders as one continuous
   polygon rather than a sequence of disconnected segments). Inner
   members become holes when they share a polygon with an outer ring.
*/
function osmToGeoJSON(elements) {
  const features = [];

  // small helpers
  const coordEq = (a, b) => a[0] === b[0] && a[1] === b[1];
  const isClosed = ring => ring.length >= 4 && coordEq(ring[0], ring[ring.length-1]);

  function stitchRings(segments) {
    // segments: array of [lon,lat] arrays. Join them into closed rings.
    const segs = segments.map(s => s.slice());
    const rings = [];
    while (segs.length) {
      let ring = segs.shift().slice();
      let extended = true;
      while (extended && !isClosed(ring)) {
        extended = false;
        for (let i = 0; i < segs.length; i++) {
          const s = segs[i];
          const head = ring[0], tail = ring[ring.length-1];
          const sHead = s[0], sTail = s[s.length-1];
          if (coordEq(tail, sHead)) {
            ring = ring.concat(s.slice(1));
            segs.splice(i, 1); extended = true; break;
          } else if (coordEq(tail, sTail)) {
            ring = ring.concat(s.slice().reverse().slice(1));
            segs.splice(i, 1); extended = true; break;
          } else if (coordEq(head, sTail)) {
            ring = s.slice().concat(ring.slice(1));
            segs.splice(i, 1); extended = true; break;
          } else if (coordEq(head, sHead)) {
            ring = s.slice().reverse().concat(ring.slice(1));
            segs.splice(i, 1); extended = true; break;
          }
        }
      }
      // Close if nearly closed; drop fragments that can't form a ring
      if (!isClosed(ring)) {
        if (ring.length >= 3) ring.push(ring[0].slice());
        else continue;
      }
      if (ring.length >= 4) rings.push(ring);
    }
    return rings;
  }

  for (const el of elements) {
    try {
      if (el.type === 'way' && el.geometry && el.geometry.length >= 3) {
        const coords = el.geometry.map(p => [p.lon, p.lat]);
        if (!isClosed(coords)) coords.push(coords[0].slice());
        features.push({
          type: 'Feature',
          properties: el.tags || {},
          geometry: { type: 'Polygon', coordinates: [coords] }
        });
      } else if (el.type === 'relation' && el.members) {
        const outerSegs = [], innerSegs = [];
        for (const m of el.members) {
          if (!m.geometry || m.geometry.length < 2) continue;
          const seg = m.geometry.map(p => [p.lon, p.lat]);
          if (m.role === 'outer') outerSegs.push(seg);
          else if (m.role === 'inner') innerSegs.push(seg);
        }
        const outerRings = stitchRings(outerSegs);
        const innerRings = stitchRings(innerSegs);
        if (!outerRings.length) continue;

        // Each outer ring becomes its own polygon; inner rings naively
        // attach to the first outer ring (good enough for our purposes —
        // the Thames has no holes worth speaking of at this scale).
        if (outerRings.length === 1) {
          features.push({
            type: 'Feature',
            properties: el.tags || {},
            geometry: {
              type: 'Polygon',
              coordinates: [outerRings[0], ...innerRings]
            }
          });
        } else {
          const polys = outerRings.map((r, i) => i === 0
            ? [r, ...innerRings]
            : [r]);
          features.push({
            type: 'Feature',
            properties: el.tags || {},
            geometry: { type: 'MultiPolygon', coordinates: polys }
          });
        }
      }
    } catch(e) { /* skip malformed elements */ }
  }
  return { type: 'FeatureCollection', features };
}

/* ══════════════════════════════════════════════════════
   PUBS
══════════════════════════════════════════════════════ */
const pubLayer = L.layerGroup();
let pubData = null;          // array of {lat, lon, name, start_date, historic}
let pubsLoading = false;
let pubsLoaded = false;

/* Tankard SVG — rendered at two sizes (single + cluster).
   `historic` swaps a filled tankard for an outlined one. */
function tankardSVG(size, historic) {
  const w = size, h = size;
  const fillBody = historic ? PAPER : INK;
  const stroke = INK;
  const sw = Math.max(0.5, size / 14);
  // viewBox 14×14 — body 6×7, handle on right, lid on top, foam dome
  return `<svg width="${w}" height="${h}" viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg">
    <!-- foam dome -->
    <path d="M3.2,3 Q5,1.5 7,2.2 Q9,1.5 10.8,3 L10.8,4 L3.2,4 Z" fill="${INK}"/>
    <!-- body -->
    <rect x="3" y="4" width="6" height="7" fill="${fillBody}" stroke="${stroke}" stroke-width="${sw}"/>
    <!-- handle -->
    <path d="M9,5.5 q3,0.5 3,2.5 t-3,2.5" fill="none" stroke="${stroke}" stroke-width="${sw}"/>
    <!-- base -->
    <rect x="2.6" y="11" width="6.8" height="1" fill="${INK}"/>
  </svg>`;
}

async function fetchPubs() {
  const cacheKey = `lg_pubs_${CACHE_VERSION}_${BBOX}`;
  const cached = cacheGet(cacheKey);
  if (cached) return cached;

  // Pubs are nodes (most common) or ways (large pubs with building outlines).
  // Exclude disused: namespace and explicit closed pubs.
  const query = `
    [out:json][timeout:60];
    (
      node["amenity"="pub"](${BBOX});
      way["amenity"="pub"](${BBOX});
    );
    out center tags;
  `;
  try {
    const j = await fetchOverpass(query);
    const pubs = [];
    for (const el of j.elements) {
      const tags = el.tags || {};
      // Skip closed/disused pubs
      if (tags['disused:amenity']) continue;
      if (tags['abandoned:amenity']) continue;
      if (tags['was:amenity']) continue;
      if (tags['amenity'] !== 'pub') continue;  // belt-and-braces

      const lat = el.type === 'node' ? el.lat : el.center?.lat;
      const lon = el.type === 'node' ? el.lon : el.center?.lon;
      if (lat == null || lon == null) continue;

      pubs.push({
        lat, lon,
        name: tags.name || 'Unnamed pub',
        start_date: tags.start_date || tags['building:start_date'] || null,
        historic: tags.historic === 'yes' || !!tags.heritage
      });
    }
    cacheSet(cacheKey, pubs);
    return pubs;
  } catch(e) {
    console.warn('Pub load failed:', e);
    return [];
  }
}

function loadPubsOnce() {
  if (pubsLoaded || pubsLoading) {
    if (pubsLoaded) renderPubs();
    return;
  }
  pubsLoading = true;
  fetchPubs().then(p => {
    pubData = p;
    pubsLoaded = true;
    pubsLoading = false;
    renderPubs();
  });
}

/* Cluster pubs into a grid at coarse zooms; render individually at fine zooms.
   Grid cell size shrinks as zoom increases; at zoom ≥14 every pub becomes
   its own marker. */
function gridKey(lat, lon, cellDeg) {
  // cellDeg is the size in degrees; quantise lat/lon into cells.
  return `${Math.floor(lat/cellDeg)}_${Math.floor(lon/cellDeg)}`;
}

function renderPubs() {
  pubLayer.clearLayers();
  if (!pubData?.length) return;

  const z = map.getZoom();
  const bounds = map.getBounds();

  // Filter to viewport (with a small buffer) so we don't waste DOM nodes
  const buf = 0.02;
  const visible = pubData.filter(p =>
    p.lat > bounds.getSouth() - buf && p.lat < bounds.getNorth() + buf &&
    p.lon > bounds.getWest()  - buf && p.lon < bounds.getEast()  + buf
  );

  if (z >= 14) {
    // Individual tankards
    for (const p of visible) {
      const size = 14;
      const html = tankardSVG(size, p.historic);
      const icon = L.divIcon({
        className: 'pub-icon',
        html,
        iconSize: [size, size],
        iconAnchor: [size/2, size]
      });
      const m = L.marker([p.lat, p.lon], { icon });
      const meta = p.start_date ? `<div class="pub-meta">est. ${p.start_date}</div>` : '';
      m.bindPopup(`<div class="pub-name">${escapeHtml(p.name)}</div>${meta}`);
      pubLayer.addLayer(m);
    }
  } else if (z >= 12) {
    // Grid clusters — cell size grows as we zoom out
    const cellDeg = z === 13 ? 0.004 : 0.008; // ~440m at 13, ~880m at 12
    const cells = new Map();
    for (const p of visible) {
      const k = gridKey(p.lat, p.lon, cellDeg);
      if (!cells.has(k)) cells.set(k, { lat: 0, lon: 0, n: 0, hist: 0 });
      const c = cells.get(k);
      c.lat += p.lat; c.lon += p.lon; c.n += 1;
      if (p.historic) c.hist += 1;
    }
    for (const c of cells.values()) {
      const cx = c.lat / c.n, cy = c.lon / c.n;
      const size = Math.min(28, 12 + Math.log2(c.n) * 3);
      const histDominant = c.hist > c.n / 2;
      const html =
        `<div style="position:relative;width:${size}px;height:${size}px;">` +
          tankardSVG(size, histDominant) +
          (c.n > 1 ? `<span class="ccount">${c.n}</span>` : '') +
        `</div>`;
      const icon = L.divIcon({
        className: 'pub-cluster-icon',
        html,
        iconSize: [size, size],
        iconAnchor: [size/2, size]
      });
      const m = L.marker([cx, cy], { icon });
      m.on('click', () => map.setView([cx, cy], Math.min(15, map.getZoom() + 2)));
      pubLayer.addLayer(m);
    }
  }
  // Below zoom 12: nothing — too dense to render meaningfully
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// Re-render pubs on zoom and pan (only when in pubs mode and loaded)
map.on('zoomend moveend', () => {
  if (MODES[modeIdx] === 'pubs' && pubsLoaded) renderPubs();
});


const MODES = ['land', 'city', 'pubs'];
let modeIdx = 0;

function applyMode() {
  const mode = MODES[modeIdx];
  const tp = document.querySelector('.leaflet-tile-pane');
  // Tiles visible in city + pubs modes only
  if (tp) tp.style.opacity = (mode === 'land') ? '0' : '1';
  // Pub layer only in pubs mode
  if (mode === 'pubs') {
    if (!map.hasLayer(pubLayer)) map.addLayer(pubLayer);
    loadPubsOnce(); // idempotent — fetches first time only
  } else {
    if (map.hasLayer(pubLayer)) map.removeLayer(pubLayer);
  }
  // Update label highlight states
  document.getElementById('ll').classList.toggle('on', mode === 'land');
  document.getElementById('lc').classList.toggle('on', mode === 'city');
  document.getElementById('lp').classList.toggle('on', mode === 'pubs');
  // Tint the toggle pip subtly when in non-default state
  document.getElementById('toggle').classList.toggle('city', mode !== 'land');
}

function doToggle() {
  modeIdx = (modeIdx + 1) % MODES.length;
  applyMode();
}
document.addEventListener('keydown', e => { if (e.key==='t'||e.key==='T') doToggle(); });

// Start in land mode — tiles hidden
document.querySelector('.leaflet-tile-pane') &&
  (document.querySelector('.leaflet-tile-pane').style.opacity = '0');

// We need to wait for Leaflet to create the tile pane
map.on('load', () => applyMode());

/* ══════════════════════════════════════════════════════
   CHORUS — six 60×38 animated SVG cells
══════════════════════════════════════════════════════ */
let _tick = 0;

function chorusThames() {
  // Westminster tide is mAOD: typically -2.5 (low) to +4.5 (high).
  // Map to a 0..1 fill so the cell shows a visibly rising/falling river.
  const raw = W.tide ? parseFloat(W.tide.value) : NaN;
  const t = isNaN(raw) ? 0.5 : raw;
  const fill = Math.max(0.05, Math.min(0.95, (t + 2.5) / 7));
  const surface = 35 - fill * 28;
  const phase = _tick * 0.04;
  let s = '';

  // Far bank shore lines (subtle)
  for (let y = 30; y <= 36; y += 2.5)
    s += `<line x1="0" y1="${y}" x2="60" y2="${y}" stroke="${INK}" stroke-width="0.25" opacity="0.2"/>`;

  // Water surface — gentle wave
  s += `<path d="M0,${(surface+Math.sin(phase)*0.7).toFixed(1)} Q15,${(surface-0.8+Math.sin(phase+1)*0.7).toFixed(1)} 30,${(surface+Math.sin(phase+2)*0.7).toFixed(1)} T60,${(surface+Math.sin(phase+3)*0.7).toFixed(1)}" fill="none" stroke="${INK}" stroke-width="1.2"/>`;

  // Water hatching beneath
  for (let y = surface+3; y < 36; y += 2.5) {
    let x = 0;
    while (x < 60) {
      const len = 4 + ((x*13+y*7)%7);
      s += `<line x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="${Math.min(60,(x+len)).toFixed(0)}" y2="${y.toFixed(0)}" stroke="${INK}" stroke-width="0.35"/>`;
      x += len + 2;
    }
  }

  // ── Mudlark on exposed foreshore ──
  // Appears when tide is genuinely low — i.e. there's a strip of mud
  // between the water surface and the cell base big enough to stand on.
  // The lower the tide, the more space they have, the more visible.
  const mudHeight = 36 - (surface + 1);   // vertical mud strip in svg units
  const mudlarkVisible = !isNaN(raw) && mudHeight > 6 && t < 0.5;
  if (mudlarkVisible) {
    const muddiness = Math.min(1, (0.5 - t) / 2.5);  // 0..1 darkness of mud
    // Mud texture — small dots/pebbles on the exposed strip
    for (let i = 0; i < 12; i++) {
      const px = (i * 7 + 3) % 60;
      const py = surface + 2 + ((i * 5) % Math.max(1, mudHeight - 3));
      if (py < 35) {
        s += `<circle cx="${px}" cy="${py.toFixed(1)}" r="${(0.4 + (i%3)*0.2).toFixed(1)}" fill="${INK}" opacity="${(0.35 + muddiness*0.3).toFixed(2)}"/>`;
      }
    }

    // Position the mudlark near the right side of the cell
    const mx = 42;
    const groundY = 35;   // their feet level
    const mlScale = Math.min(1, mudHeight / 16);  // smaller if mud strip is shallow

    // Mudlark figure — bent silhouette, low to the ground.
    // Built as an inline group, scaled around their feet so they appear to
    // grow taller as more mud exposes.
    s += `<g transform="translate(${mx} ${groundY}) scale(${mlScale.toFixed(2)})">`;

    // Lantern beside them (left of figure) — small box on the ground, glow
    const lanternGlow = `<circle cx="-7" cy="-2" r="3.5" fill="#f4d89a" opacity="0.55"/>`;
    const lantern = `
      ${lanternGlow}
      <rect x="-8.2" y="-3.5" width="2.4" height="3" fill="#f4d89a" stroke="${INK}" stroke-width="0.3"/>
      <line x1="-7" y1="-4.2" x2="-7" y2="-3.5" stroke="${INK}" stroke-width="0.3"/>
      <line x1="-7" y1="-4.5" x2="-7" y2="-4.2" stroke="${INK}" stroke-width="0.3"/>
    `;
    s += lantern;

    // The figure itself — bent over, searching the mud.
    // Coordinates relative to (0,0) = feet on the ground.
    // Legs (bent, kneeling stance)
    s += `<path d="M-1.5,0 L-1,-3 L-2.5,-5" stroke="${INK}" stroke-width="0.9" fill="none" stroke-linecap="round"/>`;
    s += `<path d="M1.5,0 L1,-3 L2.5,-5" stroke="${INK}" stroke-width="0.9" fill="none" stroke-linecap="round"/>`;
    // Body — hunched forward
    s += `<path d="M-1,-5 Q0,-7 2,-7 Q3.5,-7 4,-5.5" stroke="${INK}" stroke-width="1" fill="${INK}" fill-opacity="0.4" stroke-linecap="round"/>`;
    // Head — small, looking down
    s += `<circle cx="4.5" cy="-7.5" r="1.2" fill="${INK}"/>`;
    // Hat (flat cap silhouette)
    s += `<path d="M3.3,-8.4 L5.7,-8.4 L5.2,-8.7 Q4.5,-8.9 3.8,-8.7 Z" fill="${INK}"/>`;
    // Brim continuing forward
    s += `<line x1="5.5" y1="-8.3" x2="6.2" y2="-8.2" stroke="${INK}" stroke-width="0.7" stroke-linecap="round"/>`;
    // Arm reaching down to the mud
    s += `<path d="M3,-6 Q4.5,-4 5.5,-2" stroke="${INK}" stroke-width="0.8" fill="none" stroke-linecap="round"/>`;
    // Hand — small mark at the mud
    s += `<circle cx="5.5" cy="-1.5" r="0.6" fill="${INK}"/>`;
    // Basket beside them (right)
    s += `<path d="M7,-2 L11,-2 L10.5,0 L7.5,0 Z" fill="none" stroke="${INK}" stroke-width="0.7"/>`;
    // Basket weave
    s += `<line x1="7.2" y1="-1.2" x2="10.8" y2="-1.2" stroke="${INK}" stroke-width="0.3"/>`;
    s += `<line x1="7.5" y1="-0.5" x2="10.5" y2="-0.5" stroke="${INK}" stroke-width="0.3"/>`;
    // Basket handle
    s += `<path d="M7,-2 Q9,-3.5 11,-2" stroke="${INK}" stroke-width="0.5" fill="none"/>`;

    s += '</g>';
  }

  // Low-tide bird hint (only when very low, no mudlark room or alongside them)
  if (fill < 0.25 && !mudlarkVisible) {
    for (let i = 0; i < 5; i++) {
      s += `<ellipse cx="${6 + i*11}" cy="${(surface-1.5).toFixed(1)}" rx="1.8" ry="0.7" fill="${INK}"/>`;
    }
  }

  // Tide gauge on the left edge
  const gaugeTop = Math.max(2, surface - 5);
  const gaugeH = Math.max(1, 36 - gaugeTop);
  s += `<rect x="0" y="${gaugeTop.toFixed(1)}" width="2" height="${gaugeH.toFixed(1)}" fill="${INK}"/>`;
  for (let m = 0; m < 4; m++)
    s += `<line x1="0" y1="${(gaugeTop+m*4).toFixed(1)}" x2="3" y2="${(gaugeTop+m*4).toFixed(1)}" stroke="${INK}" stroke-width="0.5"/>`;
  return s;
}

function chorusWind() {
  const w = W.weather?.wind_speed_10m || 0;
  const speed = Math.min(1, w / 30);
  let s = '';
  for (let i=0;i<6;i++) {
    const baseY = 6 + i*5;
    const offset = (i*17)%60;
    const driftPx = (_tick*(0.35+speed*1.5)+offset)%80;
    const x = driftPx - 10;
    const len = 5 + speed*9;
    if (x > -len && x < 60)
      s += `<line x1="${x.toFixed(1)}" y1="${baseY}" x2="${(x+len).toFixed(1)}" y2="${(baseY-1)}" stroke="${INK}" stroke-width="0.45" opacity="${(0.28+speed*0.42).toFixed(2)}"/>`;
  }
  const flutter = Math.sin(_tick*0.15*(0.5+speed))*2;
  s += `<line x1="30" y1="36" x2="30" y2="18" stroke="${INK}" stroke-width="1"/>`;
  s += `<path d="M30,18 Q${(37+flutter).toFixed(1)},${(20+flutter*0.3).toFixed(1)} 44,22 L${(37+flutter).toFixed(1)},${(26+flutter*0.3).toFixed(1)} L30,27 Z" fill="${INK}"/>`;
  s += `<line x1="0" y1="36" x2="60" y2="36" stroke="${INK}" stroke-width="0.6"/>`;
  return s;
}

function chorusAir() {
  const n = W.air?.nitrogen_dioxide || 30;
  const density = Math.min(1, n/100);
  let s = '';
  s += `<rect x="43" y="27" width="13" height="6" fill="${INK}"/>`;
  s += `<rect x="45" y="22" width="8"  height="5" fill="${INK}"/>`;
  s += `<rect x="46" y="23" width="2"  height="2" fill="${PAPER}"/>`;
  s += `<rect x="49" y="23" width="2"  height="2" fill="${PAPER}"/>`;
  s += `<circle cx="46" cy="33" r="1.4" fill="${INK}"/>`;
  s += `<circle cx="53" cy="33" r="1.4" fill="${INK}"/>`;
  const numP = Math.floor(16+density*36);
  for (let i=0;i<numP;i++) {
    const seed=(i*41)%100;
    const drift=((_tick*0.45+seed*0.3))%50;
    const px=43-drift, py=26-(seed*0.18)%13-drift*0.1;
    if (px<0||py<2) continue;
    s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${(0.3+(i%3)*0.14).toFixed(1)}" fill="${INK}" opacity="${(0.22+density*0.42).toFixed(2)}"/>`;
  }
  s += `<line x1="0" y1="36" x2="60" y2="36" stroke="${INK}" stroke-width="0.6"/>`;
  return s;
}

function chorusLamps() {
  const c = nowConditions();
  const lit = c.is_dark || c.is_dawn;
  // Single iconic Victorian street gas-lamp head, centred.
  // Lit: warm amber glow against dark cell.
  // Unlit: simple ink outline against parchment.
  const LAMP = lit ? '#f4d89a' : INK;
  const GLOW = '#f4d89a';
  let s = '';

  // Dark backdrop if lit
  if (lit) s += `<rect x="0" y="0" width="60" height="38" fill="#1a140c"/>`;

  const cx = 30;

  // Halo behind the lamp (lit only)
  if (lit) {
    const pulse = 1 + Math.sin(_tick * 0.06) * 0.08;
    s += `<circle cx="${cx}" cy="18" r="${(18 * pulse).toFixed(1)}" fill="${GLOW}" opacity="0.12"/>`;
    s += `<circle cx="${cx}" cy="18" r="${(12 * pulse).toFixed(1)}" fill="${GLOW}" opacity="0.22"/>`;
  }

  // Finial on top — small ball + spike (the classic ornamental top)
  s += `<circle cx="${cx}" cy="4" r="1" fill="${LAMP}"/>`;
  s += `<line x1="${cx}" y1="2" x2="${cx}" y2="5" stroke="${LAMP}" stroke-width="0.8"/>`;

  // Crown roof — six-sided pagoda-like cap with curved sloping edges
  // (the cast-iron crown that sits over the glass panels)
  s += `<path d="M${cx-7},10 Q${cx},5 ${cx+7},10 L${cx+6},11 L${cx-6},11 Z" fill="${LAMP}"/>`;
  // Decorative ridge lines on the crown
  s += `<line x1="${cx-4}" y1="10" x2="${cx-4}" y2="6.5" stroke="${lit ? '#1a140c' : PAPER}" stroke-width="0.4" opacity="0.5"/>`;
  s += `<line x1="${cx}" y1="9.5" x2="${cx}" y2="5.5" stroke="${lit ? '#1a140c' : PAPER}" stroke-width="0.4" opacity="0.5"/>`;
  s += `<line x1="${cx+4}" y1="10" x2="${cx+4}" y2="6.5" stroke="${lit ? '#1a140c' : PAPER}" stroke-width="0.4" opacity="0.5"/>`;

  // Top frieze — narrow ornamental band beneath the crown
  s += `<rect x="${cx-6.5}" y="11" width="13" height="1.5" fill="${LAMP}"/>`;

  // Glass lantern body — four panels separated by mullions
  // Outer frame
  s += `<rect x="${cx-6}" y="12.5" width="12" height="11" fill="none" stroke="${LAMP}" stroke-width="0.9"/>`;
  // Lit: glowing glass interior + flame
  if (lit) {
    s += `<rect x="${cx-5.4}" y="13.1" width="10.8" height="9.8" fill="${GLOW}" opacity="0.85"/>`;
    // The mantle/flame at the centre — bright core
    s += `<ellipse cx="${cx}" cy="18.5" rx="1.6" ry="3" fill="#fff5d0"/>`;
    s += `<ellipse cx="${cx}" cy="19" rx="0.8" ry="2" fill="#fff"/>`;
  }
  // Mullions — vertical bars dividing the glass into panels
  s += `<line x1="${cx-2}" y1="12.5" x2="${cx-2}" y2="23.5" stroke="${LAMP}" stroke-width="0.6"/>`;
  s += `<line x1="${cx+2}" y1="12.5" x2="${cx+2}" y2="23.5" stroke="${LAMP}" stroke-width="0.6"/>`;
  // Horizontal mid-bar (Victorian lamps often have a ladder rest about 2/3 down)
  s += `<line x1="${cx-6.5}" y1="20" x2="${cx+6.5}" y2="20" stroke="${LAMP}" stroke-width="0.5"/>`;

  // Bottom frieze
  s += `<rect x="${cx-6.5}" y="23.5" width="13" height="1.3" fill="${LAMP}"/>`;
  // Decorative collar narrowing down to the post
  s += `<path d="M${cx-5},24.8 L${cx-2},27 L${cx+2},27 L${cx+5},24.8 Z" fill="${LAMP}"/>`;

  // Ornamental scrollwork — small curls either side just below the glass
  // (the famous London "swan-neck" or "fleur-de-lys" brackets)
  s += `<path d="M${cx-6.5},14 Q${cx-9},14 ${cx-9.5},16 Q${cx-9.5},17.5 ${cx-8},17 Q${cx-7.5},16.5 ${cx-8},15.5" fill="none" stroke="${LAMP}" stroke-width="0.7" stroke-linecap="round"/>`;
  s += `<path d="M${cx+6.5},14 Q${cx+9},14 ${cx+9.5},16 Q${cx+9.5},17.5 ${cx+8},17 Q${cx+7.5},16.5 ${cx+8},15.5" fill="none" stroke="${LAMP}" stroke-width="0.7" stroke-linecap="round"/>`;

  // Stub of the post visible at the bottom
  s += `<rect x="${cx-1.3}" y="27" width="2.6" height="9" fill="${LAMP}"/>`;

  // Ground line + soft pool of light (lit only)
  if (lit) {
    s += `<ellipse cx="${cx}" cy="36" rx="14" ry="2" fill="${GLOW}" opacity="0.25"/>`;
  }
  s += `<line x1="0" y1="36" x2="60" y2="36" stroke="${LAMP}" stroke-width="0.6" opacity="${lit ? 0.7 : 1}"/>`;

  return s;
}

function chorusPollen() {
  const total = W.air
    ? (W.air.birch_pollen||0)+(W.air.alder_pollen||0)+(W.air.grass_pollen||0)+(W.air.mugwort_pollen||0)+(W.air.ragweed_pollen||0)
    : 0;
  const density = Math.min(1, total/80);
  let s = '';
  s += `<rect x="6"  y="26" width="2.5" height="10" fill="${INK}"/>`;
  s += `<line x1="7" y1="26" x2="3"  y2="18" stroke="${INK}" stroke-width="0.9"/>`;
  s += `<line x1="7" y1="26" x2="11" y2="18" stroke="${INK}" stroke-width="0.9"/>`;
  s += `<line x1="7" y1="23" x2="1"  y2="14" stroke="${INK}" stroke-width="0.7"/>`;
  s += `<line x1="7" y1="23" x2="13" y2="14" stroke="${INK}" stroke-width="0.7"/>`;
  s += `<line x1="7" y1="26" x2="7"  y2="10" stroke="${INK}" stroke-width="0.9"/>`;
  s += `<line x1="0" y1="36" x2="60" y2="36" stroke="${INK}" stroke-width="0.6"/>`;
  if (density > 0.05) {
    const numP = Math.floor(10+density*40);
    for (let i=0;i<numP;i++) {
      const seed=(i*53)%100, drift=(_tick*0.38+seed*0.5)%55;
      const px=10+drift, py=8+(seed*0.18)%18-drift*0.12;
      if (px>57||py<2) continue;
      s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${(0.3+(i%3)*0.1).toFixed(1)}" fill="${INK}" opacity="${(0.28+density*0.42).toFixed(2)}"/>`;
    }
  } else {
    s += `<text x="36" y="22" text-anchor="middle" font-family="serif" font-size="6" fill="${INK}" opacity="0.4">—</text>`;
  }
  return s;
}

function chorusTemp() {
  // London annual range roughly -2°C (cold winter morning) to 32°C (heatwave).
  // Map to thermometer fill 0..1 with the bulb always full.
  const t = W.weather?.temperature_2m;
  const val = (typeof t === 'number') ? t : 12;
  const fill = Math.max(0, Math.min(1, (val + 5) / 40));   // -5..35°C → 0..1
  const tubeTop = 6, tubeBot = 28;
  const mercTop = tubeBot - (tubeBot - tubeTop) * fill;
  const cx = 30;
  let s = '';
  // ground line
  s += `<line x1="0" y1="36" x2="60" y2="36" stroke="${INK}" stroke-width="0.6"/>`;
  // tick marks down each side of the tube
  for (let i = 0; i <= 5; i++) {
    const ty = tubeTop + i * ((tubeBot - tubeTop) / 5);
    const tw = (i % 5 === 0) ? 4 : 2.5;
    s += `<line x1="${cx-5}" y1="${ty.toFixed(1)}" x2="${(cx-5-tw).toFixed(1)}" y2="${ty.toFixed(1)}" stroke="${INK}" stroke-width="0.4" opacity="0.6"/>`;
    s += `<line x1="${cx+5}" y1="${ty.toFixed(1)}" x2="${(cx+5+tw).toFixed(1)}" y2="${ty.toFixed(1)}" stroke="${INK}" stroke-width="0.4" opacity="0.6"/>`;
  }
  // tube outline (rectangle with rounded top)
  s += `<rect x="${cx-2.5}" y="${tubeTop}" width="5" height="${tubeBot-tubeTop}" fill="${PAPER}" stroke="${INK}" stroke-width="0.7"/>`;
  s += `<circle cx="${cx}" cy="${tubeTop}" r="2.5" fill="${PAPER}" stroke="${INK}" stroke-width="0.7"/>`;
  // mercury column — rises with temperature
  s += `<rect x="${cx-1.6}" y="${mercTop.toFixed(1)}" width="3.2" height="${(tubeBot - mercTop).toFixed(1)}" fill="${INK}"/>`;
  // bulb at the bottom — always solid
  s += `<circle cx="${cx}" cy="${tubeBot+3}" r="4" fill="${INK}" stroke="${INK}" stroke-width="0.7"/>`;
  // a small heat-shimmer if it's hot, frost flakes if it's cold
  if (val >= 25) {
    for (let i = 0; i < 3; i++) {
      const sx = 10 + i * 18;
      const phase = _tick * 0.06 + i * 1.7;
      s += `<path d="M${sx},${(20 - Math.sin(phase)*1.5).toFixed(1)} q2,-2 4,0 t4,0" fill="none" stroke="${INK}" stroke-width="0.4" opacity="0.45"/>`;
    }
  } else if (val <= 2) {
    [[8,12],[50,10],[12,28],[48,26]].forEach(([fx, fy]) => {
      s += `<g transform="translate(${fx},${fy}) rotate(${(_tick*0.5)%360})" opacity="0.5">`;
      for (let a = 0; a < 6; a++) {
        const ang = (a/6) * Math.PI * 2;
        s += `<line x1="0" y1="0" x2="${(Math.cos(ang)*1.8).toFixed(1)}" y2="${(Math.sin(ang)*1.8).toFixed(1)}" stroke="${INK}" stroke-width="0.4"/>`;
      }
      s += `</g>`;
    });
  }
  return s;
}

/* ══════════════════════════════════════════════════════
   CELESTIAL CARTOUCHE — sun and moon trade places
   Inline (very simplified) solar+lunar position math.
   Returns altitude (radians above horizon) and azimuth
   (radians clockwise from north). Accurate to ~1° which
   is more than enough for decorative placement.
══════════════════════════════════════════════════════ */

function solarPosition(date, lat, lon) {
  const rad = Math.PI / 180;
  const dayMs = 1000 * 60 * 60 * 24;
  // Julian day
  const J1970 = 2440588;
  const J2000 = 2451545;
  const J = date.valueOf() / dayMs - 0.5 + J1970 - J2000;
  // Mean anomaly
  const M = rad * (357.5291 + 0.98560028 * J);
  // Equation of center
  const C = rad * (1.9148 * Math.sin(M) + 0.0200 * Math.sin(2*M) + 0.0003 * Math.sin(3*M));
  // Ecliptic longitude
  const P = rad * 102.9372;
  const L = M + C + P + Math.PI;
  // Obliquity
  const e = rad * 23.4397;
  // Right ascension, declination
  const ra  = Math.atan2(Math.sin(L) * Math.cos(e), Math.cos(L));
  const dec = Math.asin(Math.sin(L) * Math.sin(e));
  // Sidereal time
  const lw  = rad * -lon;
  const phi = rad * lat;
  const theta = rad * (280.16 + 360.9856235 * J) - lw;
  const H = theta - ra;
  // Altitude + azimuth
  const altitude = Math.asin(Math.sin(phi)*Math.sin(dec) + Math.cos(phi)*Math.cos(dec)*Math.cos(H));
  const azimuth  = Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi) - Math.tan(dec)*Math.cos(phi)) + Math.PI;
  return { altitude, azimuth };
}

function lunarPosition(date, lat, lon) {
  // Same approach, lunar-specific orbital elements
  const rad = Math.PI / 180;
  const dayMs = 1000 * 60 * 60 * 24;
  const J1970 = 2440588;
  const J2000 = 2451545;
  const d = date.valueOf() / dayMs - 0.5 + J1970 - J2000;
  const L = rad * (218.316 + 13.176396 * d);  // ecliptic longitude
  const M = rad * (134.963 + 13.064993 * d);  // mean anomaly
  const F = rad * (93.272 + 13.229350 * d);   // mean distance
  const lambda = L + rad * 6.289 * Math.sin(M);
  const beta   = rad * 5.128 * Math.sin(F);
  const e = rad * 23.4397;
  const ra  = Math.atan2(Math.sin(lambda)*Math.cos(e) - Math.tan(beta)*Math.sin(e), Math.cos(lambda));
  const dec = Math.asin(Math.sin(beta)*Math.cos(e) + Math.cos(beta)*Math.sin(e)*Math.sin(lambda));
  const lw  = rad * -lon;
  const phi = rad * lat;
  const theta = rad * (280.16 + 360.9856235 * d) - lw;
  const H = theta - ra;
  const altitude = Math.asin(Math.sin(phi)*Math.sin(dec) + Math.cos(phi)*Math.cos(dec)*Math.cos(H));
  const azimuth  = Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi) - Math.tan(dec)*Math.cos(phi)) + Math.PI;
  // Phase (very rough — distance from new moon in days, normalised)
  const phaseDays = ((d - 0) % 29.530588853 + 29.530588853) % 29.530588853;
  const phase = phaseDays / 29.530588853;  // 0..1, 0=new, 0.5=full
  return { altitude, azimuth, phase };
}

/* Convert (alt, az) to an (x%, y%) position on screen.
   Use the map centre as the observer. Azimuth: 0=N, 90=E, 180=S, 270=W.
   On a top-down map of London, the sun mostly sits in the southern half of
   the sky, so we project the azimuth onto x (east-west) and put altitude
   on y (higher = closer to centre/up; lower = nearer the edge).
*/
function celestialScreenPos(altitude, azimuth) {
  // Below horizon: hidden
  if (altitude < -0.05) return null;
  // X: from azimuth. Map east(90°) → 88%, west(270°) → 12%, south(180°) → 50%
  // North-rising/setting sun is rare at London latitude, clamp.
  const azDeg = (azimuth * 180 / Math.PI + 360) % 360;
  let xFrac;
  if (azDeg < 180) {
    // Morning side (east through south): 90→88%, 180→50%
    xFrac = 0.5 + 0.38 * Math.cos((azDeg - 90) * Math.PI / 180);
    // Better: simply map E→right, W→left
    xFrac = 0.88 - (azDeg - 90) / 180 * 0.76;  // 90→0.88, 270→0.12
  } else {
    xFrac = 0.88 - (azDeg - 90) / 180 * 0.76;
  }
  xFrac = Math.max(0.08, Math.min(0.92, xFrac));
  // Y: from altitude. High alt (90°) → top of map (10%); horizon → 75%
  const altDeg = altitude * 180 / Math.PI;
  const yFrac = Math.max(0.12, Math.min(0.78, 0.78 - (altDeg / 90) * 0.66));
  return { xFrac, yFrac };
}

/* Draw the sun figure or the moon figure into the SVG.
   Sun is modelled on 17th-century engraving: triangular alternating rays
   with internal hatching, naturalistic contemplative face, warm ochre. */
function celestialSVG(body, phase) {
  if (body === 'sun') {
    const cx = 40, cy = 40;
    const discR = 18;
    const OCHRE = '#c98a2b';     // body of the rays and face fill
    const OCHRE_D = '#8a4818';   // darker ink for outlines and hatching
    let s = '<g>';

    // ── Rays ── alternating long and short pointed triangles all the way round
    // Long rays: 24 total, alternating long/short (12 of each)
    const numRays = 20;
    for (let i = 0; i < numRays; i++) {
      const isLong = i % 2 === 0;
      const halfWidth = isLong ? 0.10 : 0.07;   // radians at the base
      const innerR = discR + 1;
      const outerR = isLong ? 37 : 30;
      const ang = (i / numRays) * Math.PI * 2 - Math.PI/2;
      const a1 = ang - halfWidth;
      const a2 = ang + halfWidth;
      const x1 = cx + Math.cos(a1) * innerR;
      const y1 = cy + Math.sin(a1) * innerR;
      const x2 = cx + Math.cos(a2) * innerR;
      const y2 = cy + Math.sin(a2) * innerR;
      const tx = cx + Math.cos(ang) * outerR;
      const ty = cy + Math.sin(ang) * outerR;
      // Ray fill
      s += `<path d="M${x1.toFixed(2)},${y1.toFixed(2)} L${tx.toFixed(2)},${ty.toFixed(2)} L${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${OCHRE}" stroke="${OCHRE_D}" stroke-width="0.6" stroke-linejoin="round"/>`;
      // Internal hatching — fine parallel lines along the ray axis
      const numHatch = isLong ? 4 : 3;
      for (let h = 1; h <= numHatch; h++) {
        const frac = h / (numHatch + 1);
        // A line from a point on the base toward the tip
        const baseX = x1 + (x2 - x1) * frac;
        const baseY = y1 + (y2 - y1) * frac;
        // Shorten so hatch doesn't poke past the tip
        const endX = baseX + (tx - baseX) * 0.85;
        const endY = baseY + (ty - baseY) * 0.85;
        s += `<line x1="${baseX.toFixed(2)}" y1="${baseY.toFixed(2)}" x2="${endX.toFixed(2)}" y2="${endY.toFixed(2)}" stroke="${OCHRE_D}" stroke-width="0.35" opacity="0.55"/>`;
      }
    }

    // ── Disc ──
    s += `<circle cx="${cx}" cy="${cy}" r="${discR}" fill="#f0c878" stroke="${OCHRE_D}" stroke-width="0.9"/>`;
    // Subtle hatching shading on the disc (curved shadow on right side)
    s += '<g opacity="0.35" clip-path="circle(' + discR + 'px at ' + cx + 'px ' + cy + 'px)">';
    for (let i = 0; i < 14; i++) {
      const y = cy - discR + i * (discR * 2 / 14);
      // Curve right-side hatching to suggest sphere
      s += `<path d="M${cx + 4},${y.toFixed(1)} Q${cx + 14},${(y + 2).toFixed(1)} ${cx + 17},${(y - 1).toFixed(1)}" fill="none" stroke="${OCHRE_D}" stroke-width="0.3"/>`;
    }
    s += '</g>';

    // ── Face ── contemplative, naturalistic
    // Eyebrows: thin arched
    s += `<path d="M${cx-7},${cy-3} Q${cx-4.5},${cy-4.5} ${cx-2},${cy-3}" fill="none" stroke="${OCHRE_D}" stroke-width="0.7" stroke-linecap="round"/>`;
    s += `<path d="M${cx+2},${cy-3} Q${cx+4.5},${cy-4.5} ${cx+7},${cy-3}" fill="none" stroke="${OCHRE_D}" stroke-width="0.7" stroke-linecap="round"/>`;
    // Eyes — almond shape, pupils
    s += `<ellipse cx="${cx-4.5}" cy="${cy-1}" rx="2" ry="1.1" fill="#fff" stroke="${OCHRE_D}" stroke-width="0.5"/>`;
    s += `<ellipse cx="${cx+4.5}" cy="${cy-1}" rx="2" ry="1.1" fill="#fff" stroke="${OCHRE_D}" stroke-width="0.5"/>`;
    s += `<circle cx="${cx-4.5}" cy="${cy-1}" r="0.7" fill="${OCHRE_D}"/>`;
    s += `<circle cx="${cx+4.5}" cy="${cy-1}" r="0.7" fill="${OCHRE_D}"/>`;
    // Nose — soft inverted V with curve at base
    s += `<path d="M${cx},${cy-1} Q${cx-1.5},${cy+2.5} ${cx-1},${cy+4} Q${cx},${cy+4.6} ${cx+1},${cy+4} Q${cx+1.5},${cy+2.5} ${cx},${cy-1}" fill="none" stroke="${OCHRE_D}" stroke-width="0.55" stroke-linecap="round"/>`;
    // Nostrils — tiny dots
    s += `<circle cx="${cx-0.6}" cy="${cy+4}" r="0.3" fill="${OCHRE_D}"/>`;
    s += `<circle cx="${cx+0.6}" cy="${cy+4}" r="0.3" fill="${OCHRE_D}"/>`;
    // Mouth — small, closed, slightly downturned (contemplative, not smiling)
    s += `<path d="M${cx-2.5},${cy+7} Q${cx},${cy+7.6} ${cx+2.5},${cy+7}" fill="none" stroke="${OCHRE_D}" stroke-width="0.7" stroke-linecap="round"/>`;
    // Lower lip suggestion
    s += `<path d="M${cx-2},${cy+7.5} Q${cx},${cy+8.4} ${cx+2},${cy+7.5}" fill="none" stroke="${OCHRE_D}" stroke-width="0.45" opacity="0.6"/>`;
    // Cheek hatching — short curved strokes
    for (let i = 0; i < 4; i++) {
      const dy = i * 0.8;
      s += `<path d="M${cx-9},${cy+2+dy} Q${cx-7},${cy+2.5+dy} ${cx-6},${cy+3+dy}" fill="none" stroke="${OCHRE_D}" stroke-width="0.25" opacity="0.5"/>`;
      s += `<path d="M${cx+6},${cy+3+dy} Q${cx+7},${cy+2.5+dy} ${cx+9},${cy+2+dy}" fill="none" stroke="${OCHRE_D}" stroke-width="0.25" opacity="0.5"/>`;
    }
    // Chin shading
    s += `<path d="M${cx-4},${cy+10} Q${cx},${cy+11.5} ${cx+4},${cy+10}" fill="none" stroke="${OCHRE_D}" stroke-width="0.4" opacity="0.4"/>`;

    s += '</g>';
    return s;
  } else {
    // ── Engraved moon ── matched in style to the sun.
    // Three states: full (round contemplative face), crescent (profile with
    // nose and lips), new (faint dashed circle, no figure).
    const cx = 40, cy = 40;
    const moonR = 22;
    const SILVER = '#d8c896';      // pale lunar body
    const SILVER_D = '#6e5a32';    // darker ink for lines & hatching
    const isFull = phase > 0.42 && phase < 0.58;
    const isNew  = phase < 0.04 || phase > 0.96;
    let s = '<g>';

    if (isNew) {
      // Dashed outline only — new moon
      s += `<circle cx="${cx}" cy="${cy}" r="${moonR}" fill="none" stroke="${SILVER_D}" stroke-width="0.7" stroke-dasharray="2 2.5" opacity="0.55"/>`;
      // A few faint stars around it
      [[18,18],[62,22],[20,60],[60,58],[40,12]].forEach(([sx, sy]) => {
        s += `<path d="M${sx},${sy-2} L${sx+0.6},${sy-0.6} L${sx+2},${sy} L${sx+0.6},${sy+0.6} L${sx},${sy+2} L${sx-0.6},${sy+0.6} L${sx-2},${sy} L${sx-0.6},${sy-0.6} Z" fill="${SILVER_D}" opacity="0.5"/>`;
      });
      s += '</g>';
      return s;
    }

    if (isFull) {
      // Full moon: round face seen head-on. Maria as soft dark patches.
      s += `<circle cx="${cx}" cy="${cy}" r="${moonR}" fill="${SILVER}" stroke="${SILVER_D}" stroke-width="0.9"/>`;
      // Curved hatching for sphericality (left side, shadow side)
      s += `<g opacity="0.3" clip-path="circle(${moonR}px at ${cx}px ${cy}px)">`;
      for (let i = 0; i < 16; i++) {
        const y = cy - moonR + i * (moonR * 2 / 16);
        s += `<path d="M${cx - 18},${y.toFixed(1)} Q${cx - 8},${(y - 2).toFixed(1)} ${cx - 4},${(y + 1).toFixed(1)}" fill="none" stroke="${SILVER_D}" stroke-width="0.3"/>`;
      }
      s += `</g>`;
      // Maria (dark patches)
      s += `<ellipse cx="${cx - 6}" cy="${cy - 5}" rx="3.5" ry="2.2" fill="${SILVER_D}" opacity="0.22"/>`;
      s += `<ellipse cx="${cx + 7}" cy="${cy + 1}" rx="4" ry="2.8" fill="${SILVER_D}" opacity="0.22"/>`;
      s += `<ellipse cx="${cx - 2}" cy="${cy + 8}" rx="3" ry="1.8" fill="${SILVER_D}" opacity="0.2"/>`;
      // Sleepy eyes — closed arcs (the moon is the night, after all)
      s += `<path d="M${cx-7},${cy-2} Q${cx-4.5},${cy-3.5} ${cx-2},${cy-2}" fill="none" stroke="${SILVER_D}" stroke-width="0.7" stroke-linecap="round"/>`;
      s += `<path d="M${cx+2},${cy-2} Q${cx+4.5},${cy-3.5} ${cx+7},${cy-2}" fill="none" stroke="${SILVER_D}" stroke-width="0.7" stroke-linecap="round"/>`;
      // Lash hatching beneath each closed eye
      for (let i = -2; i <= 2; i++) {
        s += `<line x1="${cx - 4.5 + i*0.9}" y1="${cy - 1.5}" x2="${cx - 4.5 + i*0.9}" y2="${cy - 0.5}" stroke="${SILVER_D}" stroke-width="0.3"/>`;
        s += `<line x1="${cx + 4.5 + i*0.9}" y1="${cy - 1.5}" x2="${cx + 4.5 + i*0.9}" y2="${cy - 0.5}" stroke="${SILVER_D}" stroke-width="0.3"/>`;
      }
      // Small contemplative mouth
      s += `<path d="M${cx-2.5},${cy+6} Q${cx},${cy+6.6} ${cx+2.5},${cy+6}" fill="none" stroke="${SILVER_D}" stroke-width="0.7" stroke-linecap="round"/>`;
      // Lower lip
      s += `<path d="M${cx-2},${cy+6.5} Q${cx},${cy+7.4} ${cx+2},${cy+6.5}" fill="none" stroke="${SILVER_D}" stroke-width="0.4" opacity="0.6"/>`;
      // Cheek hatching mirror of the sun
      for (let i = 0; i < 3; i++) {
        const dy = i * 0.8;
        s += `<path d="M${cx-11},${cy+1+dy} Q${cx-9},${cy+1.5+dy} ${cx-8},${cy+2+dy}" fill="none" stroke="${SILVER_D}" stroke-width="0.25" opacity="0.45"/>`;
        s += `<path d="M${cx+8},${cy+2+dy} Q${cx+9},${cy+1.5+dy} ${cx+11},${cy+1+dy}" fill="none" stroke="${SILVER_D}" stroke-width="0.25" opacity="0.45"/>`;
      }
      s += '</g>';
      return s;
    }

    // Crescent — classic profile man-in-the-moon facing toward the sun
    const waxing = phase < 0.5;
    // The lit fraction (0..1) of the moon's width
    const lit = Math.abs(phase - 0.5) * 2;       // 0=full,1=new
    const litFrac = 1 - lit;                      // visible crescent thickness

    // Build the crescent shape using arcs.
    // For a waxing moon the lit side is the RIGHT (facing west, where the sun set).
    // Outer arc is always the full circle; inner arc curves opposite for crescent.
    // We'll render the lit crescent as a single path with two elliptical arcs.
    const innerEllipseX = moonR * (1 - 2 * litFrac); // negative = beyond centre
    const dir = waxing ? 1 : -1;
    // Two points where outer + inner meet: top and bottom of crescent
    const top = `${cx},${cy - moonR}`;
    const bot = `${cx},${cy + moonR}`;
    // Outer arc (full moon circle, on lit side)
    // Path: M top, A outer-arc to bot (large=0, sweep=lit-side), A inner-arc back to top
    const outerSweep = waxing ? 1 : 0;
    const innerSweep = waxing ? 0 : 1;
    const innerRX = Math.max(1, Math.abs(innerEllipseX));
    const crescentPath =
      `M ${top} ` +
      `A ${moonR} ${moonR} 0 0 ${outerSweep} ${bot} ` +
      `A ${innerRX} ${moonR} 0 0 ${innerSweep} ${top} Z`;
    // Faint full disc shadow first (so you can see "the rest of the moon")
    s += `<circle cx="${cx}" cy="${cy}" r="${moonR}" fill="${SILVER}" opacity="0.15" stroke="${SILVER_D}" stroke-width="0.4" stroke-dasharray="1 2"/>`;
    // Lit crescent
    s += `<path d="${crescentPath}" fill="${SILVER}" stroke="${SILVER_D}" stroke-width="0.9" stroke-linejoin="round"/>`;
    // Hatching INSIDE the crescent for engraved feel
    s += `<g clip-path="path('${crescentPath}')" opacity="0.45">`;
    for (let i = 0; i < 18; i++) {
      const y = cy - moonR + i * (moonR * 2 / 18);
      s += `<line x1="${cx - moonR}" y1="${y.toFixed(1)}" x2="${cx + moonR}" y2="${y.toFixed(1)}" stroke="${SILVER_D}" stroke-width="0.3"/>`;
    }
    s += `</g>`;
    // Profile face on the lit side
    const faceX = waxing ? cx + 7 : cx - 7;
    const nosePeakX = waxing ? faceX + 4 : faceX - 4;
    // Eye (single, profile)
    s += `<circle cx="${faceX}" cy="${cy - 4}" r="0.9" fill="${SILVER_D}"/>`;
    s += `<path d="M${faceX - 2},${cy - 5.5} Q${faceX},${cy - 6.5} ${faceX + 2},${cy - 5.5}" fill="none" stroke="${SILVER_D}" stroke-width="0.5" stroke-linecap="round"/>`;
    // Nose — protruding hook
    s += `<path d="M${faceX + (waxing ? 1 : -1)},${cy - 2} Q${nosePeakX},${cy} ${faceX + (waxing ? 1 : -1)},${cy + 3}" fill="none" stroke="${SILVER_D}" stroke-width="0.85" stroke-linecap="round"/>`;
    // Mouth — small, slightly curved
    const mouthX = faceX + (waxing ? -2 : 2);
    s += `<path d="M${mouthX},${cy + 5} Q${faceX + (waxing ? 0 : 0)},${cy + 5.6} ${faceX + (waxing ? 1 : -1)},${cy + 5}" fill="none" stroke="${SILVER_D}" stroke-width="0.6" stroke-linecap="round"/>`;
    // Chin curve hint
    s += `<path d="M${faceX + (waxing ? -1 : 1)},${cy + 7} Q${faceX + (waxing ? 2 : -2)},${cy + 8} ${faceX + (waxing ? 0 : 0)},${cy + 9}" fill="none" stroke="${SILVER_D}" stroke-width="0.4" opacity="0.6"/>`;
    s += '</g>';
    return s;
  }
}

function updateCelestial() {
  const now = new Date();
  const sun = solarPosition(now, RLAT, RLON);
  const el = document.getElementById('celestial');
  const svg = document.getElementById('celestial-svg');
  if (!el || !svg) return;
  // Pick body: sun if above horizon, otherwise moon
  let body, pos, phase = 0;
  if (sun.altitude > -0.05) {
    body = 'sun';
    pos = celestialScreenPos(sun.altitude, sun.azimuth);
  } else {
    const moon = lunarPosition(now, RLAT, RLON);
    phase = moon.phase;
    if (moon.altitude > -0.05) {
      body = 'moon';
      pos = celestialScreenPos(moon.altitude, moon.azimuth);
    } else {
      // Both below horizon — hide
      el.style.opacity = '0';
      return;
    }
  }
  if (!pos) { el.style.opacity = '0'; return; }
  el.style.opacity = '0.85';
  // Position relative to the map container
  const mapEl = document.getElementById('map');
  const w = mapEl.clientWidth, h = mapEl.clientHeight;
  el.style.left = `${(pos.xFrac * w).toFixed(0)}px`;
  el.style.top  = `${(pos.yFrac * h).toFixed(0)}px`;
  svg.innerHTML = celestialSVG(body, phase);
}


const RENDERERS = { thames:chorusThames, wind:chorusWind, air:chorusAir, lamps:chorusLamps, pollen:chorusPollen, temp:chorusTemp };

/* Readouts: each cell has two forms — a "sign" (poetic word naming the
   phenomenon) and a "value" (precise number with units). The display
   alternates between them every few seconds so the chorus reads as
   atmosphere when you glance and as data when you look. */
function readouts() {
  const c = nowConditions();

  // ── Thames / tide ──
  const tideVal = W.tide ? parseFloat(W.tide.value) : NaN;
  let thamesSign, thamesValue;
  if (isNaN(tideVal)) {
    thamesSign = '—'; thamesValue = '—';
  } else {
    // Westminster mAOD: roughly -2.5 (very low) to +4.5 (very high)
    if      (tideVal >  3.5) thamesSign = 'flooding';
    else if (tideVal >  2.0) thamesSign = 'high';
    else if (tideVal >  0.5) thamesSign = 'rising';
    else if (tideVal > -1.0) thamesSign = 'low';
    else                     thamesSign = 'mudlarks';
    thamesValue = `${tideVal.toFixed(1)} <span class="crd-u">m</span>`;
  }

  // ── Wind ──
  const windKph = W.weather?.wind_speed_10m;
  let windSign, windValue;
  if (typeof windKph !== 'number') {
    windSign = '—'; windValue = '—';
  } else {
    if      (windKph <  2)  windSign = 'still';
    else if (windKph <  6)  windSign = 'calm';
    else if (windKph < 12)  windSign = 'breezy';
    else if (windKph < 22)  windSign = 'fresh';
    else if (windKph < 35)  windSign = 'blowing';
    else                    windSign = 'gale';
    windValue = `${windKph.toFixed(0)} <span class="crd-u">kph</span>`;
  }

  // ── Air (NO₂) ──
  const no2 = W.air?.nitrogen_dioxide;
  let airSign, airValue;
  if (typeof no2 !== 'number') {
    airSign = '—'; airValue = '—';
  } else {
    if      (no2 < 20)  airSign = 'clear';
    else if (no2 < 40)  airSign = 'fair';
    else if (no2 < 80)  airSign = 'hazy';
    else if (no2 < 120) airSign = 'foul';
    else                airSign = 'smog';
    airValue = `${no2.toFixed(0)} <span class="crd-u">µg</span>`;
  }

  // ── Lamps ──
  // The lamp cell is its own sign already; readout just names the state.
  // Two forms for consistency — both short words, no number to alternate to.
  const lit = c.is_dark || c.is_dawn;
  const lampsSign = lit ? 'lit' : 'unlit';
  const lampsValue = lit ? 'glowing' : 'dark';

  // ── Pollen ──
  const pollen = c.pollen_total;
  let pollenSign, pollenValue;
  if (!W.air || typeof pollen !== 'number') {
    pollenSign = '—'; pollenValue = '—';
  } else {
    if      (pollen < 1)  pollenSign = 'none';
    else if (pollen < 10) pollenSign = 'low';
    else if (pollen < 30) pollenSign = 'rising';
    else if (pollen < 60) pollenSign = 'heavy';
    else                  pollenSign = 'thick';
    pollenValue = `${pollen.toFixed(0)} <span class="crd-u">/m³</span>`;
  }

  // ── Temperature ──
  const tempVal = W.weather?.temperature_2m;
  let tempSign, tempValue;
  if (typeof tempVal !== 'number') {
    tempSign = '—'; tempValue = '—';
  } else {
    if      (tempVal < 0)  tempSign = 'freezing';
    else if (tempVal < 6)  tempSign = 'cold';
    else if (tempVal < 12) tempSign = 'cool';
    else if (tempVal < 18) tempSign = 'mild';
    else if (tempVal < 24) tempSign = 'warm';
    else if (tempVal < 30) tempSign = 'hot';
    else                   tempSign = 'sweltering';
    tempValue = `${tempVal.toFixed(1)}°`;
  }

  return {
    thames: { sign: thamesSign, value: thamesValue },
    wind:   { sign: windSign,   value: windValue },
    air:    { sign: airSign,    value: airValue },
    lamps:  { sign: lampsSign,  value: lampsValue },
    pollen: { sign: pollenSign, value: pollenValue },
    temp:   { sign: tempSign,   value: tempValue }
  };
}

/* Which form to show right now. Toggles every ~4 seconds. */
let _readoutMode = 'sign';  // alternates 'sign' ↔ 'value'
setInterval(() => {
  _readoutMode = (_readoutMode === 'sign') ? 'value' : 'sign';
  // Fade transition on each readout
  document.querySelectorAll('.crd').forEach(el => {
    el.classList.add('crd-fade');
    setTimeout(() => el.classList.remove('crd-fade'), 220);
  });
  // Trigger an immediate chorus update so the readouts swap
  updateChorus();
}, 4000);



function updateChorus() {
  const c = nowConditions();
  const lampsLit = c.is_dark || c.is_dawn;
  const ready  = { thames: c.is_high_tide, wind: c.is_windy, air: c.no2 != null && c.no2 > 50, lamps: false, pollen: c.pollen_active, temp: false };
  const muted  = { wind: c.is_calm, lamps: !lampsLit, pollen: !c.pollen_active };
  const labels = readouts();
  for (const [id, fn] of Object.entries(RENDERERS)) {
    const cell = document.querySelector(`.cc[data-id="${id}"]`);
    const cv   = document.getElementById('cv-'+id);
    const rd   = document.getElementById('rd-'+id);
    if (cv) cv.innerHTML = fn();
    if (rd) {
      const label = labels[id];
      rd.innerHTML = label ? (label[_readoutMode] ?? label.sign ?? '') : '';
    }
    if (!cell) continue;
    cell.classList.remove('mute','ready','lit');
    if (id === 'lamps' && lampsLit) cell.classList.add('lit');
    else if (muted[id]) cell.classList.add('mute');
    else if (ready[id]) cell.classList.add('ready');
  }
}

function frame() {
  _tick++;
  if (_tick % 4 === 0) updateChorus();
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════════ */
(async () => {
  // Hide tiles on start (land mode)
  map.whenReady(() => {
    const tp = document.querySelector('.leaflet-tile-pane');
    if (tp) tp.style.opacity = '0';
  });

  // Start chorus immediately with defaults
  updateChorus();
  updateCelestial();
  requestAnimationFrame(frame);

  // Refresh celestial position every minute (sun/moon move slowly)
  setInterval(updateCelestial, 60 * 1000);
  // And reposition on window resize so it tracks the map
  window.addEventListener('resize', updateCelestial);

  // Fetch live data (non-blocking — chorus updates when it arrives)
  fetchAll().then(() => updateChorus());
  setInterval(fetchAll, 10 * 60 * 1000);

  // Load map overlays — fire both in parallel; each renders as soon as it
  // resolves (no waiting on the slower one). Cached layers will paint
  // synchronously on first call, so the loading notice often never appears
  // on repeat visits.
  const notice = document.getElementById('loading-notice');
  const greenP = loadGreenSpaces();
  const waterP = loadWater();

  // If both resolve from cache, hide the notice immediately.
  Promise.all([greenP, waterP]).then(([g, w]) => {
    if (g?.fromCache && w?.fromCache) {
      if (notice) notice.remove();
      return;
    }
    if (notice) notice.style.opacity = '0';
    setTimeout(() => { if (notice) notice.remove(); }, 1200);
  });

  // Quick check: if both came from cache synchronously, also drop the notice early.
  setTimeout(() => {
    if (greenLayer.getLayers().length && waterLayer.getLayers().length && notice) {
      notice.style.opacity = '0';
    }
  }, 100);
})();

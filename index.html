<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>London Green — A Survey of Open Spaces</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=IM+Fell+English:ital,wght@0,400;1,400&family=IM+Fell+DW+Pica+SC&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --paper:    #ede4cf;
    --paper-2:  #e3d8bd;
    --ink:      #1a140c;
    --ink-soft: #2c2418;
    --ochre:    #8a4818;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #1a140c;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IM Fell English', Georgia, serif;
    overflow: hidden;
  }

  /* ── Outer page ── */
  #page {
    position: relative;
    width:  min(96vw, 860px);
    height: min(96vh, 900px);
    background:
      radial-gradient(ellipse at 12% 8%,  rgba(120,80,30,0.10), transparent 35%),
      radial-gradient(ellipse at 88% 14%, rgba(90,60,20,0.08),  transparent 40%),
      radial-gradient(ellipse at 30% 92%, rgba(110,70,25,0.10), transparent 38%),
      radial-gradient(ellipse at 78% 78%, rgba(80,50,15,0.07),  transparent 42%),
      var(--paper);
  }
  #page::after {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      repeating-linear-gradient(0deg,  rgba(60,40,15,0.025) 0px, rgba(60,40,15,0.025) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(60,40,15,0.018) 0px, rgba(60,40,15,0.018) 1px, transparent 1px, transparent 4px);
    z-index: 200; mix-blend-mode: multiply;
  }

  /* ── Map sits below masthead + chorus ── */
  #map {
    position: absolute;
    top: 118px; left: 10px; right: 10px; bottom: 10px;
    z-index: 1;
  }
  .maplibregl-ctrl-logo,
  .maplibregl-ctrl-attrib,
  .maplibregl-ctrl-group { display: none !important; }

  /* ── Masthead ── */
  #masthead {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 52px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-bottom: 1px solid var(--ink);
    z-index: 15;
    padding: 0 40px;
  }
  #masthead h1 {
    font-family: 'UnifrakturCook', serif;
    font-size: 1.7rem; font-weight: 700;
    line-height: 1; color: var(--ink);
  }
  #masthead .sub {
    font-family: 'IM Fell DW Pica SC', serif;
    font-size: 0.6rem; letter-spacing: 0.22em;
    color: var(--ink-soft); margin-top: 3px;
  }

  /* ── Chorus strip ── */
  #chorus {
    position: absolute;
    top: 52px; left: 10px; right: 10px;
    height: 66px;
    display: flex;
    background: var(--paper-2);
    border-top: 1px solid var(--ink);
    border-bottom: 3px double var(--ink);
    z-index: 15;
  }
  .chorus-cell {
    flex: 1 1 0;
    padding: 5px 2px 3px;
    text-align: center;
    border-right: 1px solid rgba(26,20,12,0.25);
    position: relative;
    transition: background 0.6s ease;
    cursor: default;
  }
  .chorus-cell:last-child { border-right: none; }
  .chorus-cell .cv {
    width: 100%; height: 40px; display: block;
  }
  .chorus-cell .lbl {
    font-family: 'IM Fell DW Pica SC', serif;
    font-size: 0.5rem; letter-spacing: 0.14em;
    color: var(--ink-soft); margin-top: 2px;
  }
  .chorus-cell.mute  { opacity: 0.38; }
  .chorus-cell.ready { animation: ready-pulse 4s ease-in-out infinite; }
  @keyframes ready-pulse {
    0%, 100% { background: rgba(138,72,24,0.06); }
    50%      { background: rgba(138,72,24,0.14); }
  }

  /* ── Border SVG overlay ── */
  #border {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }

  /* ── Toggle ── */
  #toggle {
    position: absolute;
    bottom: 22px; left: 50%; transform: translateX(-50%);
    z-index: 20; pointer-events: all;
    display: flex; align-items: center; gap: 10px;
    background: rgba(237,228,207,0.95);
    border: 1px solid var(--ink-soft);
    padding: 5px 16px 6px;
    cursor: pointer; user-select: none;
  }
  #toggle::before {
    content: ''; position: absolute; inset: 3px;
    border: 0.4px solid var(--ink-soft); pointer-events: none;
  }
  #toggle:hover { background: var(--paper); }
  .tl {
    font-family: 'IM Fell DW Pica SC', serif;
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-soft); opacity: 0.45; transition: opacity .3s;
  }
  .tl.on { opacity: 1; color: var(--ink); }
  .pip {
    width: 9px; height: 9px;
    background: var(--ink-soft); transform: rotate(45deg);
    opacity: 0.3; transition: opacity .3s, background .3s; flex-shrink: 0;
  }
  #toggle.city .pip { background: var(--ink); opacity: 1; }
</style>
</head>
<body>
<div id="page">

  <!-- Masthead -->
  <header id="masthead">
    <h1>London Green</h1>
    <div class="sub">A Survey of Parks, Commons &amp; Open Waters &middot; Inner London</div>
  </header>

  <!-- Chorus strip -->
  <div id="chorus">
    <div class="chorus-cell" data-speaker="thames">
      <svg viewBox="0 0 60 40" class="cv" id="cv-thames"></svg>
      <div class="lbl">River</div>
    </div>
    <div class="chorus-cell" data-speaker="wind">
      <svg viewBox="0 0 60 40" class="cv" id="cv-wind"></svg>
      <div class="lbl">Wind</div>
    </div>
    <div class="chorus-cell" data-speaker="air">
      <svg viewBox="0 0 60 40" class="cv" id="cv-air"></svg>
      <div class="lbl">Air</div>
    </div>
    <div class="chorus-cell" data-speaker="lamps">
      <svg viewBox="0 0 60 40" class="cv" id="cv-lamps"></svg>
      <div class="lbl">Lamps</div>
    </div>
    <div class="chorus-cell" data-speaker="pollen">
      <svg viewBox="0 0 60 40" class="cv" id="cv-pollen"></svg>
      <div class="lbl">Pollen</div>
    </div>
    <div class="chorus-cell" data-speaker="green">
      <svg viewBox="0 0 60 40" class="cv" id="cv-green"></svg>
      <div class="lbl">Green</div>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Border SVG — 860 wide, height matches page -->
  <svg id="border" viewBox="0 0 860 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">

    <!-- Outer frame rules -->
    <rect x="4"   y="4"   width="852" height="892" fill="none" stroke="#1a140c" stroke-width="2"/>
    <rect x="7.5" y="7.5" width="845" height="885" fill="none" stroke="#1a140c" stroke-width="0.4"/>

    <!-- Diamond corner ornaments -->
    <path d="M4,4    L8,8   L4,12  L0,8   Z" fill="#1a140c"/>
    <path d="M856,4  L860,8 L856,12 L852,8 Z" fill="#1a140c"/>
    <path d="M4,896  L8,900 L4,904 L0,900 Z" fill="#1a140c" transform="translate(0,-4)"/>
    <path d="M856,896 L860,900 L856,904 L852,900 Z" fill="#1a140c" transform="translate(0,-4)"/>

    <!-- Left + right slim margins -->
    <rect x="0"   y="52" width="10" height="848" fill="#e3d8bd"/>
    <line x1="10" y1="52" x2="10" y2="890" stroke="#1a140c" stroke-width="0.6"/>
    <rect x="850" y="52" width="10" height="848" fill="#e3d8bd"/>
    <line x1="850" y1="52" x2="850" y2="890" stroke="#1a140c" stroke-width="0.6"/>

    <!-- Bottom margin -->
    <rect x="0"   y="890" width="860" height="10" fill="#e3d8bd"/>
    <line x1="10" y1="890" x2="850" y2="890" stroke="#1a140c" stroke-width="0.6"/>

    <!-- Map aperture inner rule -->
    <rect x="10" y="118" width="840" height="771" fill="none" stroke="#1a140c" stroke-width="0.5"/>

    <!-- Diamond ornaments at map aperture corners -->
    <path d="M10,118  L14,122 L10,126 L6,122  Z"  fill="#1a140c"/>
    <path d="M850,118 L854,122 L850,126 L846,122 Z" fill="#1a140c"/>
    <path d="M10,888  L14,892 L10,896 L6,892  Z"  fill="#1a140c" opacity="0.5"/>
    <path d="M850,888 L854,892 L850,896 L846,892 Z" fill="#1a140c" opacity="0.5"/>

    <!-- Legend strip at base of map (semi-opaque backing) -->
    <rect x="10" y="860" width="840" height="30" fill="rgba(237,228,207,0.9)"/>
    <line x1="10" y1="860" x2="850" y2="860" stroke="#1a140c" stroke-width="0.8"/>
    <line x1="10" y1="862" x2="850" y2="862" stroke="#1a140c" stroke-width="0.3"/>

    <!-- Legend swatches -->
    <rect x="100" y="868" width="12" height="8" fill="#c8ddb8" stroke="#3d6b3a" stroke-width="0.8" rx="0.4"/>
    <text x="116" y="876" font-family="'IM Fell DW Pica SC',serif" font-size="7.5" letter-spacing="0.14em" fill="#1a140c">Parks &amp; Open Space</text>
    <rect x="270" y="868" width="12" height="8" fill="#b8d4e8" stroke="#4a7a9b" stroke-width="0.8" rx="0.4"/>
    <text x="286" y="876" font-family="'IM Fell DW Pica SC',serif" font-size="7.5" letter-spacing="0.14em" fill="#1a140c">Rivers &amp; Lakes</text>
    <rect x="410" y="868" width="12" height="8" fill="#dfd0a8" stroke="#8a7a5a" stroke-width="0.8" rx="0.4"/>
    <text x="426" y="876" font-family="'IM Fell DW Pica SC',serif" font-size="7.5" letter-spacing="0.14em" fill="#1a140c">Built City</text>
    <text x="840" y="876" text-anchor="end"
          font-family="'IM Fell English',serif" font-style="italic" font-size="7"
          fill="#2c2418" opacity="0.6">OpenStreetMap contributors · press T to toggle</text>
  </svg>

  <!-- Toggle -->
  <div id="toggle" onclick="doToggle()">
    <span class="tl on" id="ll">Land</span>
    <div class="pip"></div>
    <span class="tl" id="lc">City</span>
  </div>
</div>

<script>
'use strict';

/* ── Palette ── */
const INK   = '#1a140c';
const PAPER = '#e3d8bd';

/* ── Live data state ── */
const W = { weather: null, air: null, tide: null };

const RLAT = 51.505, RLON = -0.118;

async function fetchAll() {
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${RLAT}&longitude=${RLON}&current=temperature_2m,rain,wind_speed_10m,wind_direction_10m,cloud_cover&daily=sunrise,sunset&timezone=Europe/London`);
    const j = await r.json();
    W.weather = j.current;
    W.sun = j.daily ? { sunrise: j.daily.sunrise[0], sunset: j.daily.sunset[0] } : null;
  } catch(e) {}
  try {
    const r = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${RLAT}&longitude=${RLON}&current=nitrogen_dioxide,birch_pollen,grass_pollen,alder_pollen,mugwort_pollen,ragweed_pollen&timezone=Europe/London`);
    W.air = (await r.json()).current;
  } catch(e) {}
  try {
    const r = await fetch('https://environment.data.gov.uk/flood-monitoring/id/stations/E70839/readings?latest');
    W.tide = (await r.json()).items?.[0];
  } catch(e) {}
}

function nowConditions() {
  const now = new Date();
  const h = now.getHours(), month = now.getMonth();
  let isDark = h < 6 || h >= 20, isDawn = false;
  if (W.sun) {
    const t = now.getTime();
    const sr = new Date(W.sun.sunrise).getTime();
    const ss = new Date(W.sun.sunset).getTime();
    isDark = t < sr || t > ss;
    isDawn = !isDark && (t - sr) < 60 * 60 * 1000;
  }
  const temp = W.weather?.temperature_2m ?? 12;
  const rain = W.weather?.rain ?? 0;
  const cloud = W.weather?.cloud_cover ?? 50;
  const wind = W.weather?.wind_speed_10m ?? 8;
  const tide = W.tide ? parseFloat(W.tide.value) : NaN;
  const pollenTotal = W.air ? (
    (W.air.birch_pollen||0)+(W.air.alder_pollen||0)+(W.air.grass_pollen||0)+
    (W.air.mugwort_pollen||0)+(W.air.ragweed_pollen||0)
  ) : 0;
  return {
    is_dark: isDark, is_dawn: isDawn, month,
    temp_c: temp, rain_mm: rain, is_raining: rain > 0.2,
    cloud, is_overcast: cloud > 70,
    wind_kph: wind, is_windy: wind > 22, is_calm: wind < 5,
    tide_m: isNaN(tide) ? null : tide,
    is_high_tide: !isNaN(tide) && tide > 4.0,
    is_low_tide:  !isNaN(tide) && tide < 1.5,
    no2: W.air?.nitrogen_dioxide ?? null,
    pollen_total: pollenTotal,
    pollen_active: pollenTotal > 5
  };
}

/* ══════════════════════════════════════════════
   CHORUS RENDERERS  (60×40 SVG fragments)
══════════════════════════════════════════════ */

let _tick = 0;

function chorusThames() {
  const t = W.tide ? parseFloat(W.tide.value) : 2.5;
  const fill = isNaN(t) ? 0.4 : Math.max(0.05, Math.min(0.95, t / 6));
  const surface = 38 - fill * 30;
  const phase = _tick * 0.04;
  let s = '';
  // faint hatch lines behind water
  for (let y = 32; y <= 38; y += 2.5)
    s += `<line x1="0" y1="${y}" x2="60" y2="${y}" stroke="${INK}" stroke-width="0.25" opacity="0.25"/>`;
  // surface wave
  s += `<path d="M0,${(surface+Math.sin(phase)*0.7).toFixed(1)} Q15,${(surface-0.8+Math.sin(phase+1)*0.7).toFixed(1)} 30,${(surface+Math.sin(phase+2)*0.7).toFixed(1)} T60,${(surface+Math.sin(phase+3)*0.7).toFixed(1)}" fill="none" stroke="${INK}" stroke-width="1.2"/>`;
  // broken horizontal hatch = water body
  for (let y = surface+3; y < 38; y += 2.5) {
    let x = 0;
    while (x < 60) {
      const len = 4 + ((x*13+y*7)%7);
      s += `<line x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="${(x+len).toFixed(0)}" y2="${y.toFixed(0)}" stroke="${INK}" stroke-width="0.35"/>`;
      x += len + 2;
    }
  }
  // low-tide foreshore pebbles
  if (fill < 0.3) for (let i=0;i<5;i++)
    s += `<ellipse cx="${6+i*11}" cy="${surface-1.5}" rx="1.8" ry="0.7" fill="${INK}"/>`;
  // tide gauge post
  s += `<rect x="0" y="${(surface-5).toFixed(1)}" width="2" height="${(38-surface+5).toFixed(1)}" fill="${INK}"/>`;
  for (let m=0;m<4;m++)
    s += `<line x1="0" y1="${(surface-5+m*4).toFixed(1)}" x2="3" y2="${(surface-5+m*4).toFixed(1)}" stroke="${INK}" stroke-width="0.5"/>`;
  return s;
}

function chorusWind() {
  const w = W.weather?.wind_speed_10m || 0;
  const speed = Math.min(1, w / 30);
  let s = '';
  for (let i = 0; i < 6; i++) {
    const baseY = 7 + i * 5;
    const offset = (i * 17) % 60;
    const driftPx = (_tick * (0.35 + speed * 1.5) + offset) % 80;
    const x = driftPx - 10;
    const len = 5 + speed * 9;
    if (x > -len && x < 60)
      s += `<line x1="${x.toFixed(1)}" y1="${baseY}" x2="${(x+len).toFixed(1)}" y2="${(baseY-1).toFixed(1)}" stroke="${INK}" stroke-width="0.45" opacity="${(0.28+speed*0.42).toFixed(2)}"/>`;
  }
  const flutter = Math.sin(_tick * 0.15 * (0.5+speed)) * 2;
  s += `<line x1="30" y1="38" x2="30" y2="20" stroke="${INK}" stroke-width="1"/>`;
  s += `<path d="M30,20 Q${(37+flutter).toFixed(1)},${(22+flutter*0.3).toFixed(1)} 44,24 L${(37+flutter).toFixed(1)},${(27+flutter*0.3).toFixed(1)} L30,29 Z" fill="${INK}"/>`;
  s += `<line x1="0" y1="38" x2="60" y2="38" stroke="${INK}" stroke-width="0.6"/>`;
  return s;
}

function chorusAir() {
  const n = W.air?.nitrogen_dioxide || 30;
  const density = Math.min(1, n / 100);
  let s = '';
  // small lorry right side
  s += `<rect x="43" y="28" width="13" height="6" fill="${INK}"/>`;
  s += `<rect x="45" y="23" width="8"  height="5" fill="${INK}"/>`;
  s += `<rect x="46" y="24" width="2"  height="2" fill="${PAPER}"/>`;
  s += `<rect x="49" y="24" width="2"  height="2" fill="${PAPER}"/>`;
  s += `<circle cx="46" cy="34" r="1.4" fill="${INK}"/>`;
  s += `<circle cx="53" cy="34" r="1.4" fill="${INK}"/>`;
  const numP = Math.floor(18 + density * 38);
  for (let i = 0; i < numP; i++) {
    const seed = (i * 41) % 100;
    const drift = ((_tick * 0.45 + seed * 0.3)) % 50;
    const px = 43 - drift;
    const py = 27 - (seed*0.18)%13 - drift*0.1;
    if (px < 0 || py < 2) continue;
    s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${(0.3+(i%3)*0.14).toFixed(1)}" fill="${INK}" opacity="${(0.22+density*0.42).toFixed(2)}"/>`;
  }
  s += `<line x1="0" y1="38" x2="60" y2="38" stroke="${INK}" stroke-width="0.6"/>`;
  return s;
}

function chorusLamps() {
  const c = nowConditions();
  const lit = c.is_dark || c.is_dawn;
  let s = '';
  s += `<line x1="0" y1="38" x2="60" y2="38" stroke="${INK}" stroke-width="0.6"/>`;
  // three lamp posts
  [15, 30, 45].forEach(lx => {
    s += `<rect x="${lx-0.75}" y="10" width="1.5" height="28" fill="${INK}"/>`;
    s += `<rect x="${lx-4}" y="9" width="8" height="1.2" fill="${INK}"/>`;
    s += `<rect x="${lx-3}" y="6" width="6" height="3.5" fill="${INK}"/>`;
    if (lit) {
      const pulse = 1 + Math.sin(_tick*0.08)*0.1;
      s += `<circle cx="${lx}" cy="7.5" r="${(5*pulse).toFixed(1)}" fill="${PAPER}" opacity="0.55"/>`;
      s += `<rect x="${lx-3}" y="6" width="6" height="3.5" fill="${PAPER}" stroke="${INK}" stroke-width="0.4"/>`;
      s += `<ellipse cx="${lx}" cy="38" rx="9" ry="1.5" fill="${PAPER}" opacity="0.4"/>`;
    }
  });
  if (c.is_raining) for (let i=0;i<8;i++) {
    const seed=(i*13)%100;
    const drift=(_tick*0.6+seed*0.4)%40;
    const px=(i*7+3)%60, py=drift%38;
    s += `<line x1="${px}" y1="${py.toFixed(0)}" x2="${px+1}" y2="${(py+4).toFixed(0)}" stroke="${INK}" stroke-width="0.3" opacity="0.55"/>`;
  }
  return s;
}

function chorusPollen() {
  const counts = W.air ? {
    birch:   W.air.birch_pollen   || 0,
    alder:   W.air.alder_pollen   || 0,
    grass:   W.air.grass_pollen   || 0,
    mugwort: W.air.mugwort_pollen || 0,
    ragweed: W.air.ragweed_pollen || 0
  } : {};
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  const density = Math.min(1, total / 80);
  let s = '';
  // small tree
  s += `<rect x="6"  y="28" width="2.5" height="10" fill="${INK}"/>`;
  s += `<line x1="7" y1="28" x2="3"  y2="20" stroke="${INK}" stroke-width="0.9"/>`;
  s += `<line x1="7" y1="28" x2="11" y2="20" stroke="${INK}" stroke-width="0.9"/>`;
  s += `<line x1="7" y1="25" x2="1"  y2="16" stroke="${INK}" stroke-width="0.7"/>`;
  s += `<line x1="7" y1="25" x2="13" y2="16" stroke="${INK}" stroke-width="0.7"/>`;
  s += `<line x1="7" y1="28" x2="7"  y2="12" stroke="${INK}" stroke-width="0.9"/>`;
  s += `<line x1="0" y1="38" x2="60" y2="38" stroke="${INK}" stroke-width="0.6"/>`;
  if (density > 0.05) {
    const numP = Math.floor(12 + density * 44);
    for (let i=0;i<numP;i++) {
      const seed=(i*53)%100;
      const drift=(_tick*0.38+seed*0.5)%55;
      const px=10+drift, py=10+(seed*0.18)%20-drift*0.12;
      if (px>57||py<2) continue;
      s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${(0.3+(i%3)*0.1).toFixed(1)}" fill="${INK}" opacity="${(0.28+density*0.42).toFixed(2)}"/>`;
    }
  } else {
    s += `<text x="36" y="22" text-anchor="middle" font-family="serif" font-size="6" fill="${INK}" opacity="0.4">—</text>`;
  }
  return s;
}

/* GREEN — a stylised park with season-aware hatching. Always on. */
function chorusGreen() {
  const c = nowConditions();
  const m = c.month;
  const isLeaf = m >= 3 && m <= 10; // April–November
  let s = '';
  s += `<line x1="0" y1="38" x2="60" y2="38" stroke="${INK}" stroke-width="0.6"/>`;
  // ground
  s += `<rect x="5" y="33" width="50" height="5" fill="none"/>`;
  for (let i=0;i<10;i++)
    s += `<line x1="${5+i*5}" y1="38" x2="${5+i*5+2}" y2="33" stroke="${INK}" stroke-width="0.35" opacity="0.5"/>`;

  // three tree canopies at different heights — gently bobbing
  const bob = Math.sin(_tick * 0.05) * 0.4;
  const trees = [[12,28,7],[30,24,9],[48,28,7]];
  trees.forEach(([tx,ty,r]) => {
    s += `<rect x="${tx-1}" y="${ty+r}" width="2" height="${33-ty-r}" fill="${INK}"/>`;
    if (isLeaf) {
      // filled canopy — season green (rendered as dense hatch in ink on paper)
      s += `<ellipse cx="${tx}" cy="${(ty+bob).toFixed(1)}" rx="${r}" ry="${(r*0.75).toFixed(1)}" fill="${INK}"/>`;
      // a small paper highlight cut from canopy for depth
      s += `<ellipse cx="${tx-1}" cy="${(ty+bob-1.5).toFixed(1)}" rx="${(r*0.45).toFixed(1)}" ry="${(r*0.3).toFixed(1)}" fill="${PAPER}" opacity="0.3"/>`;
    } else {
      // bare branches — winter
      s += `<ellipse cx="${tx}" cy="${(ty+bob).toFixed(1)}" rx="${r}" ry="${(r*0.75).toFixed(1)}" fill="none" stroke="${INK}" stroke-width="0.7"/>`;
      for (let b=0;b<5;b++) {
        const ang=(b/5)*Math.PI-Math.PI/2;
        s += `<line x1="${tx}" y1="${(ty+bob).toFixed(1)}" x2="${(tx+Math.cos(ang)*r*0.9).toFixed(1)}" y2="${(ty+bob+Math.sin(ang)*r*0.75).toFixed(1)}" stroke="${INK}" stroke-width="0.5"/>`;
      }
    }
  });
  return s;
}

/* ══════════════════════════════════════════════
   CHORUS LOOP
══════════════════════════════════════════════ */

const RENDERERS = {
  thames: chorusThames,
  wind:   chorusWind,
  air:    chorusAir,
  lamps:  chorusLamps,
  pollen: chorusPollen,
  green:  chorusGreen
};

function updateChorus() {
  const c = nowConditions();
  const readiness = {
    thames: c.is_high_tide || (c.tide_m != null && c.tide_m > 3.5),
    wind:   c.is_windy,
    air:    c.no2 != null && c.no2 > 50,
    lamps:  c.is_dark || c.is_dawn,
    pollen: c.pollen_active,
    green:  true
  };
  const muted = {
    wind:   c.is_calm,
    lamps:  !c.is_dark && !c.is_dawn,
    pollen: !c.pollen_active
  };

  for (const [id, fn] of Object.entries(RENDERERS)) {
    const cell = document.querySelector(`.chorus-cell[data-speaker="${id}"]`);
    if (!cell) continue;
    const cv = document.getElementById('cv-' + id);
    if (cv) cv.innerHTML = fn();
    cell.classList.remove('mute', 'ready');
    if (muted[id]) cell.classList.add('mute');
    else if (readiness[id]) cell.classList.add('ready');
  }
}

function chorusFrame() {
  _tick++;
  if (_tick % 4 === 0) updateChorus();
  requestAnimationFrame(chorusFrame);
}

/* ══════════════════════════════════════════════
   MAP STYLE
══════════════════════════════════════════════ */

const PARCHMENT    = '#ede4cf';
const PARCHMENT_DK = '#dfd0a8';
const PARCHMENT_BLD= '#cfc09a';
const INK_FAINT    = '#8a7a5a';
const GREEN_FILL   = '#c8ddb8';
const GREEN_STR    = '#3d6b3a';
const BLUE_FILL    = '#b8d4e8';
const BLUE_STR     = '#4a7a9b';
const ROAD_GOLD    = '#c4a86a';
const ROAD_MID     = '#d4bc8a';
const ROAD_BDR     = '#a08840';

let cityMode = false;

function makeStyle(c) {
  const always = [
    { id:'bg', type:'background', paint:{'background-color': PARCHMENT} },

    // Green — landcover
    { id:'lc-green', type:'fill', source:'osm', 'source-layer':'landcover',
      filter:['in','class','park','grass','meadow','wood','forest','scrub'],
      paint:{'fill-color': GREEN_FILL, 'fill-opacity': 0.88} },
    // Green — landuse
    { id:'lu-green', type:'fill', source:'osm', 'source-layer':'landuse',
      filter:['in','class','park','grass','recreation_ground','village_green',
              'cemetery','allotments','forest','wood','nature_reserve','pitch','golf_course'],
      paint:{'fill-color': GREEN_FILL, 'fill-opacity': 0.88} },
    { id:'lu-green-line', type:'line', source:'osm', 'source-layer':'landuse',
      filter:['in','class','park','grass','recreation_ground','village_green',
              'cemetery','allotments','forest','wood','nature_reserve','pitch','golf_course'],
      paint:{'line-color': GREEN_STR, 'line-width': 0.5, 'line-opacity': 0.5} },

    // Water
    { id:'water', type:'fill', source:'osm', 'source-layer':'water',
      paint:{'fill-color': BLUE_FILL, 'fill-opacity': 0.92} },
    { id:'water-line', type:'line', source:'osm', 'source-layer':'water',
      paint:{'line-color': BLUE_STR, 'line-width': 0.8} },
    { id:'waterway', type:'line', source:'osm', 'source-layer':'waterway',
      paint:{'line-color': BLUE_FILL,
             'line-width':['interpolate',['linear'],['zoom'],8,1,14,4],
             'line-opacity': 0.9} },

    // Water + park labels always visible
    { id:'lbl-water', type:'symbol', source:'osm', 'source-layer':'water_name',
      layout:{ 'text-field':['get','name'], 'text-size': 9,
               'text-font':['Noto Sans Italic','Open Sans Italic'],
               'symbol-placement':['step',['zoom'],'point',11,'line'] },
      paint:{'text-color': BLUE_STR, 'text-halo-color': BLUE_FILL, 'text-halo-width': 1.2} },
    { id:'lbl-park', type:'symbol', source:'osm', 'source-layer':'park',
      minzoom: 11,
      layout:{ 'text-field':['get','name'], 'text-size': 9,
               'text-font':['Noto Sans Italic','Open Sans Italic'] },
      paint:{'text-color': GREEN_STR, 'text-halo-color': GREEN_FILL, 'text-halo-width': 1.2} },
  ];

  const cityLayers = c ? [
    { id:'bld', type:'fill', source:'osm', 'source-layer':'building',
      paint:{'fill-color': PARCHMENT_BLD, 'fill-opacity': 0.65} },
    { id:'bld-line', type:'line', source:'osm', 'source-layer':'building',
      paint:{'line-color': INK_FAINT, 'line-width': 0.35, 'line-opacity': 0.45} },

    { id:'rd-mot-c', type:'line', source:'osm', 'source-layer':'transportation',
      filter:['in','class','motorway','trunk'],
      layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color': ROAD_BDR,
             'line-width':['interpolate',['linear'],['zoom'],8,2.5,14,8]} },
    { id:'rd-pri-c', type:'line', source:'osm', 'source-layer':'transportation',
      filter:['in','class','primary','secondary'],
      layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color': ROAD_BDR,
             'line-width':['interpolate',['linear'],['zoom'],9,1.8,14,7]} },
    { id:'rd-mot', type:'line', source:'osm', 'source-layer':'transportation',
      filter:['in','class','motorway','trunk'],
      layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color': ROAD_GOLD,
             'line-width':['interpolate',['linear'],['zoom'],8,1.5,14,6]} },
    { id:'rd-pri', type:'line', source:'osm', 'source-layer':'transportation',
      filter:['in','class','primary','secondary'],
      layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color': ROAD_GOLD,
             'line-width':['interpolate',['linear'],['zoom'],9,1,14,5]} },
    { id:'rd-min', type:'line', source:'osm', 'source-layer':'transportation',
      filter:['in','class','tertiary','minor','service','street'],
      layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color': ROAD_MID,
             'line-width':['interpolate',['linear'],['zoom'],11,0.5,15,2.5],
             'line-opacity': 0.8} },

    { id:'lbl-city', type:'symbol', source:'osm', 'source-layer':'place',
      filter:['in','class','city','town'],
      layout:{ 'text-field':['get','name'], 'text-size': 13,
               'text-font':['Noto Sans Bold','Open Sans Bold'],
               'text-letter-spacing': 0.08, 'text-max-width': 8 },
      paint:{'text-color': INK, 'text-halo-color': PARCHMENT, 'text-halo-width': 1.8} },
    { id:'lbl-sub', type:'symbol', source:'osm', 'source-layer':'place',
      filter:['in','class','suburb','neighbourhood','quarter'],
      minzoom: 12,
      layout:{ 'text-field':['get','name'], 'text-size': 10,
               'text-font':['Noto Sans Italic','Open Sans Italic'],
               'text-letter-spacing': 0.06 },
      paint:{'text-color': '#2c2418', 'text-halo-color': PARCHMENT, 'text-halo-width': 1.4} },
    { id:'lbl-rd', type:'symbol', source:'osm', 'source-layer':'transportation_name',
      minzoom: 13,
      layout:{ 'text-field':['get','name'], 'text-size': 9,
               'text-font':['Noto Sans Regular','Open Sans Regular'],
               'symbol-placement':'line', 'text-max-angle': 30 },
      paint:{'text-color': INK, 'text-halo-color': PARCHMENT, 'text-halo-width': 1.1} },
  ] : [];

  return {
    version: 8,
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: { osm: { type:'vector', url:'https://tiles.openfreemap.org/planet' } },
    layers: [...always, ...cityLayers]
  };
}

const map = new maplibregl.Map({
  container: 'map',
  style: makeStyle(false),
  center: [-0.118, 51.505],
  zoom: 11, minZoom: 9, maxZoom: 17,
  attributionControl: false,
  maxBounds: [[-0.6, 51.28], [0.38, 51.70]]
});

function doToggle() {
  cityMode = !cityMode;
  document.getElementById('toggle').classList.toggle('city', cityMode);
  document.getElementById('ll').classList.toggle('on', !cityMode);
  document.getElementById('lc').classList.toggle('on',  cityMode);
  const ctr = map.getCenter(), zoom = map.getZoom();
  map.setStyle(makeStyle(cityMode));
  map.once('styledata', () => { map.setCenter(ctr); map.setZoom(zoom); });
}
document.addEventListener('keydown', e => { if (e.key==='t'||e.key==='T') doToggle(); });

/* ── Boot ── */
(async () => {
  await fetchAll();
  updateChorus();
  requestAnimationFrame(chorusFrame);
  setInterval(async () => { await fetchAll(); }, 10 * 60 * 1000);
})();
</script>
